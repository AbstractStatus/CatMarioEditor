<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>猫里奥关卡编辑器</title>
<link rel="stylesheet" href="editor.css?v=hd3">
<style>
/* 加载遮罩：覆盖整个页面，等 manifest 所有图片加载完毕后淡出 */
#bootMask {
  position: fixed; inset: 0; z-index: 9999;
  background: #1a1d24; color: #e8ecf4;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
  font-family: "Microsoft YaHei", sans-serif;
  user-select: none;
}
#bootMask .bm-title { font-size: 16px; color: #ffd75e; }
#bootMask .bm-bar {
  width: 320px; max-width: 70vw; height: 10px;
  background: #2a2f3c; border-radius: 5px; overflow: hidden;
}
#bootMask .bm-fill {
  width: 0; height: 100%; background: #48b048;
  transition: width .2s ease-out;
}
#bootMask .bm-text { color: #98a2b6; font-size: 12px; }
#bootMask .bm-file { color: #b8c2d6; font-size: 11px; max-width: 360px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: Consolas, "Courier New", monospace; }
</style>
</head>
<body>
<!-- 加载遮罩：在所有资源加载完成前覆盖页面 -->
<div id="bootMask">
  <div class="bm-title">🐱 猫里奥关卡编辑器 · 资源加载中</div>
  <div class="bm-bar"><div id="bmFill" class="bm-fill"></div></div>
  <div id="bmText" class="bm-text">0% (0/0)</div>
  <div id="bmFile" class="bm-file">准备加载…</div>
</div>
<div id="app">
  <!-- 顶部工具栏 -->
  <div id="toolbar">
    <span class="title">🐱 猫里奥关卡编辑器</span>
    <button id="saveBtn" title="将当前关卡保存为 JSON 文件">💾 保存JSON</button>
    <button id="loadBtn" title="读取之前保存的 JSON 关卡（也可直接把 .json 拖进窗口）">📂 读取JSON</button>
    <input type="file" id="fileInput" accept=".json,application/json" multiple style="display:none">
    <button id="demoBtn" title="从原版猫里奥全部关卡（世界）中选择一个载入">🌍 示例世界</button>
    <button id="playBtn" title="把当前关卡转换成游戏数据，在新标签页用新引擎试玩">▶ 试玩</button>
    <button id="clearBtn">🗑 清空</button>
    <span class="sep"></span>
    <label>画布列数：</label>
    <button id="colsMinus" title="横向缩短 10 列">−</button>
    <input type="number" id="colsInput" min="20" max="1000" value="120">
    <button id="colsPlus" title="横向加长 10 列">＋</button>
    <span class="sep"></span>
    <label>主题：</label>
    <select id="themeSel">
      <option value="overworld">地上（蓝）</option>
      <option value="dungeon">地下（黑）</option>
      <option value="castle">城堡（黑）</option>
      <option value="sky">空中（蓝）</option>
    </select>
    <span class="sep"></span>
    <label for="nextLevelSel">通关后：</label>
    <select id="nextLevelSel" title="玩家碰到终点旗杆通关后的去向">
      <option value="__next__">▶ 进入下一关</option>
      <option value="__end__">🏁 游戏结束</option>
    </select>
    <button id="gridBtn" title="显示/隐藏网格">▦ 网格</button>
    <button id="eraserBtn" title="橡皮工具（也可在画布上右键擦除）">🧽 橡皮</button>
    <button id="propBtn" title="编辑选中元素的属性（位置/长度/角度/传送目标等）" style="display:none">⚙ 属性</button>
    <span class="sep" id="warpSep" style="display:none"></span>
    <label id="warpLabel" for="warpSel" style="display:none">传送目标：</label>
    <select id="warpSel" style="display:none" title="选中“传送管道口”后设置进入后前往的世界，或游戏结束"></select>
  </div>

  <!-- 主体：左侧元素栏 + 中间横向滚动画布 -->
  <div id="main">
    <div id="palette"></div>
    <div id="stage-wrap">
      <canvas id="gutter" style="margin-top:20px"></canvas>
      <div id="scroller">
        <div id="stage-inner">
          <canvas id="ruler"></canvas>
          <canvas id="stage"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部状态栏 -->
  <div id="statusbar">
    <span id="status">位置：列 - / 行 -</span>
    <span id="hint">点击左侧元素，再到画布上点击/拖动放置；右键擦除；滚轮横向滚动；画布可水平增减。</span>
  </div>
</div>

<!-- 示例世界选择弹窗 -->
<div id="worldModal" class="world-mask">
  <div class="world-dialog">
    <div class="world-head">
      <span>🌍 选择要载入的世界（读取自旧引擎全部关卡）</span>
      <button id="worldClose" title="关闭">✕</button>
    </div>
    <div id="worldList" class="world-list"></div>
    <div class="world-foot">点击任一世界即可载入编辑器；未修改前点“试玩”将 1:1 还原原版关卡。</div>
  </div>
</div>

<!-- BGM 单选弹窗 -->
<div id="bgmModal" class="world-mask">
  <div class="world-dialog">
    <div class="world-head">
      <span>🎼 选择本关背景音乐（BGM）</span>
      <button id="bgmClose" title="关闭">✕</button>
    </div>
    <div id="bgmList" class="world-list"></div>
    <div class="world-foot">点击曲目即可试听并选中（单选）；BGM 是关卡级设置，不会放到画布上，试玩本关时播放。</div>
  </div>
</div>

<!-- 元素属性弹窗 -->
<div id="propModal" class="world-mask">
  <div class="world-dialog prop-dialog">
    <div class="world-head">
      <span id="propTitle">⚙ 元素属性</span>
      <button id="propClose" title="关闭">✕</button>
    </div>
    <div id="propBody" class="prop-body"></div>
    <div class="prop-foot">
      <button id="propCancel">取消</button>
      <button id="propOk">确定</button>
    </div>
  </div>
</div>

<script src="assets/sprites/manifest.js?v=shell2"></script>
<script src="elements.js?v=shell23"></script>
<script src="stages_data.js?v=shell14"></script>
<script src="editor.js?v=hd27"></script>
<script>
/* 加载画面：预加载 manifest 中所有切片 PNG，跟踪进度，完成后淡出遮罩。
 * 加载期间屏蔽所有键盘事件（capture 阶段拦截），防止编辑器接收按键放置/删除元素。 */
(function () {
  var mask = document.getElementById('bootMask');
  if (!mask) return;
  var fillEl = document.getElementById('bmFill');
  var textEl = document.getElementById('bmText');
  var fileEl = document.getElementById('bmFile');
  var lastP = -1;
  var total = 0, loaded = 0;
  // 提取 URL 中的文件名
  function basename(url) {
    if (!url) return '';
    var s = String(url).split('?')[0];
    var i = s.lastIndexOf('/');
    return i >= 0 ? s.slice(i + 1) : s;
  }
  function setP(p, file) {
    if (p === lastP && file == null) return;
    lastP = p;
    if (fillEl) fillEl.style.width = p + '%';
    if (textEl) textEl.textContent = p + '% (' + loaded + '/' + total + ')';
    if (fileEl && file != null) {
      fileEl.textContent = file ? ('当前加载：' + basename(file)) : (loaded >= total ? '完成 ✓' : '');
    }
  }
  // 加载期间屏蔽所有键盘事件（capture 阶段拦截）
  function keyBlocker(e) {
    e.preventDefault();
    e.stopImmediatePropagation();
    return false;
  }
  window.addEventListener('keydown', keyBlocker, true);
  window.addEventListener('keyup', keyBlocker, true);
  window.addEventListener('keypress', keyBlocker, true);
  function releaseBlocker() {
    window.removeEventListener('keydown', keyBlocker, true);
    window.removeEventListener('keyup', keyBlocker, true);
    window.removeEventListener('keypress', keyBlocker, true);
  }
  function finish() {
    setP(100, null);
    if (fileEl) fileEl.textContent = '完成 ✓';
    setTimeout(function () {
      mask.style.transition = 'opacity .3s';
      mask.style.opacity = '0';
      setTimeout(function () {
        mask.style.display = 'none';
        releaseBlocker();
      }, 300);
    }, 100);
  }
  // 收集 manifest 中所有切片 PNG 路径，去重
  var seen = {}, urls = [];
  if (window.SPRITE_MANIFEST && window.SPRITE_MANIFEST.sprites) {
    window.SPRITE_MANIFEST.sprites.forEach(function (s) {
      if (!s.file) return;
      var u = 'assets/sprites/' + s.file;
      if (seen[u]) return;
      seen[u] = true; urls.push(u);
    });
  }
  total = urls.length;
  // 兜底：无有效 URL 时 500ms 后直接淡出
  if (total === 0) { setTimeout(finish, 500); return; }
  // 启动加载
  setP(0, urls[0]);
  function done() {
    loaded++;
    // 估算当前正在加载的文件（最后一个未完成的）
    var cur = loaded < total ? urls[Math.min(loaded, total - 1)] : null;
    setP(Math.min(99, Math.round(loaded * 100 / total)), cur);
    if (loaded >= total) finish();
  }
  urls.forEach(function (u) {
    var im = new Image();
    im.onload = done;
    im.onerror = done;
    im.src = u;
  });
})();
</script>
</body>
</html>
