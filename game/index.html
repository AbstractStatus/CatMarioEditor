<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>猫里奥 - 新引擎</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    #wrap {
      position: relative;
      width: 100vw;
      height: 80vh;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      touch-action: none;
    }
    #hint {
      position: absolute;
      top: 4px; left: 4px;
      color: #fff;
      font-size: 12px;
      text-shadow: 1px 1px 2px #000;
      pointer-events: none;
      white-space: pre;
    }
    #loading {
      position: absolute;
      inset: 0;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    /* 镜头宽度调节条（#wrap 80vh + #viewbar 20vh = 100vh） */
    #viewbar {
      height: 20vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #000;
      color: #ccc;
      font-size: 13px;
      user-select: none;
    }
    #viewbar input[type="range"] {
      width: 42vw;
      max-width: 460px;
      accent-color: #48b048;
      cursor: pointer;
    }
    #viewbar .vw-end { color: #888; font-size: 12px; }
    #viewbar .vw-label { color: #ddd; }
    /* 刷新率切换按钮组 */
    #fpsbar { display: flex; align-items: center; gap: 4px; margin-left: 12px; }
    #fpsbar .fps-label { color: #ddd; margin-right: 4px; font-size: 13px; }
    #fpsbar button {
      background: #333; color: #ccc;
      border: 1px solid #555;
      padding: 3px 9px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      font-family: inherit;
    }
    #fpsbar button.active {
      background: #48b048; color: #fff; border-color: #48b048;
    }
    /* 全屏：#wrap 占满整个屏幕，画布高等比放大（高=屏高），
       宽强制 100%（镜头宽度=屏幕宽度），引擎 resizeCanvas 每帧
       按新 CSS 尺寸同步 baseScale/FXMAX，所有格子等比例放大 */
    #wrap:fullscreen {
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    #wrap:fullscreen canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="loading">加载中...</div>
    <div id="hint"></div>
  </div>
  <div id="viewbar">
    <span class="vw-label">镜头宽度</span>
    <span class="vw-end">正方形</span>
    <input type="range" id="vieww" min="0" max="100" step="1" value="100"
           title="向左拖动收窄镜头（最小与高度相等），向右占满页面宽度">
    <span class="vw-end">满宽</span>
    <div id="fpsbar">
      <span class="fps-label">刷新率</span>
      <button data-fps="30">30</button>
      <button data-fps="60" class="active">60</button>
      <button data-fps="120" title="实验性：60Hz 屏可能步进感，跳跃手感未校准">120</button>
    </div>
    <button id="fsbtn" title="进入全屏（ESC 退出）" style="margin-left:12px;background:#333;color:#ccc;border:1px solid #555;padding:3px 9px;font-size:12px;cursor:pointer;border-radius:3px;font-family:inherit;">全屏</button>
    <button id="recbtn" title="仅在标题画面（游戏未开始）可录制；录制期间锁定 480 标准镜头宽" style="margin-left:12px;background:#3a2030;color:#ff8080;border:1px solid #6a3a44;padding:3px 9px;font-size:12px;cursor:pointer;border-radius:3px;font-family:inherit;">● 录制</button>
    <button id="playrepbtn" title="选择录像文件（.json）播放：画面由引擎按录像按键与游戏数据还原" style="margin-left:6px;background:#20303a;color:#80c0ff;border:1px solid #3a556a;padding:3px 9px;font-size:12px;cursor:pointer;border-radius:3px;font-family:inherit;">📂 播放录像</button>
    <input type="file" id="reppicker" accept=".json,application/json" style="display:none">
  </div>

  <!-- 关卡数据 -->
  <script src="../stage11_data.js?v=1"></script>
  <!-- 精灵清单 -->
  <script src="../assets/sprites/manifest.js?v=1"></script>
  <!-- 引擎模块 -->
  <script src="constants.js?v=4"></script>
  <script src="replay.js?v=2"></script>
  <script src="sprites.js?v=hd4"></script>
  <script src="audio.js?v=10"></script>
  <script src="input.js?v=6"></script>
  <script src="elements.js?v=rep1"></script>
<script src="levels.js?v=2"></script>
<script src="engine.js?v=rep4"></script>

  <script>
    (function () {
      var canvas = document.getElementById('game');
      var hint = document.getElementById('hint');
      var loading = document.getElementById('loading');
      var wrap = document.getElementById('wrap');

      GameEngine.init(canvas);

      // ---- 镜头宽度调节 ----
      // factor: 0 = 宽=高（正方形，虚拟宽 420）；1 = 占满页面宽度
      // 引擎 resizeCanvas 每帧读取 canvas 的实际 CSS 尺寸并同步 FXMAX，
      // 这里只需控制 canvas.style.width，选择自动居中（#wrap 为 flex 容器）
      var VIEW_W_KEY = 'catmario_view_factor';
      var viewFactor = parseFloat(localStorage.getItem(VIEW_W_KEY));
      if (!(viewFactor >= 0 && viewFactor <= 1)) viewFactor = 1;
      var viewSlider = document.getElementById('vieww');
      viewSlider.value = String(Math.round(viewFactor * 100));

      function applyViewWidth() {
        var maxW = wrap.clientWidth;              // 上限：页面满宽
        var h = wrap.clientHeight;                // 画布高（80vh）
        var minW = Math.min(maxW, h);             // 下限：与高度相等的正方形
        var w = Math.round(minW + viewFactor * (maxW - minW));
        canvas.style.width = w + 'px';
      }
      viewSlider.addEventListener('input', function () {
        viewFactor = viewSlider.value / 100;
        localStorage.setItem(VIEW_W_KEY, String(viewFactor));
        applyViewWidth();
      });
      window.addEventListener('resize', applyViewWidth);
      applyViewWidth();

      // ---- 全屏（ESC 退出）----
      // 对 #wrap 请求全屏：CSS :fullscreen 使其占满屏幕，画布高=屏高，
      // 引擎 resizeCanvas 每帧按新尺寸等比例放大所有格子，
      // 画布宽=屏宽 → FXMAX 同步为屏幕宽度对应的镜头宽度。
      var fsbtn = document.getElementById('fsbtn');
      function inFs() { return document.fullscreenElement === wrap; }
      fsbtn.addEventListener('click', function () {
        if (inFs()) document.exitFullscreen();
        else if (wrap.requestFullscreen) wrap.requestFullscreen();
      });
      document.addEventListener('fullscreenchange', function () {
        fsbtn.textContent = inFs() ? '退出全屏' : '全屏';
        if (!inFs()) applyViewWidth();   // 退出后恢复镜头宽度滑块设置
      });
      // ESC 退出全屏（浏览器原生已支持，这里兜底：部分内嵌 webview 不原生退出）
      window.addEventListener('keydown', function (e) {
        if (e.keyCode === 27 && inFs()) document.exitFullscreen();
      });

      // ---- 刷新率切换 ----
      // 默认 60Hz；30Hz 稳定（原版基准）；120Hz 实验性（见 engine.js setFps 注释）
      var FPS_KEY = 'catmario_fps';
      var savedFps = parseInt(localStorage.getItem(FPS_KEY), 10);
      if (savedFps !== 30 && savedFps !== 60 && savedFps !== 120) savedFps = 60;
      var fpsbar = document.getElementById('fpsbar');
      var fpsButtons = fpsbar.querySelectorAll('button[data-fps]');
      function syncFpsButtons(fps) {
        for (var i = 0; i < fpsButtons.length; i++) {
          fpsButtons[i].classList.toggle('active',
            String(fps) === fpsButtons[i].getAttribute('data-fps'));
        }
      }
      // 应用保存的设置
      if (savedFps !== 60) {
        GameEngine.setFps(savedFps);
        syncFpsButtons(savedFps);
      }
      fpsbar.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-fps]');
        if (!btn) return;
        var fps = parseInt(btn.getAttribute('data-fps'), 10);
        GameEngine.setFps(fps);
        localStorage.setItem(FPS_KEY, String(fps));
        syncFpsButtons(fps);
      });

      // 首次用户交互解锁音频
      var audioUnlocked = false;
      function unlockAudio() {
        if (!audioUnlocked) {
          audioUnlocked = true;
          if (window.AudioSys) AudioSys.unlock();
        }
      }
      canvas.addEventListener('click', unlockAudio);
      window.addEventListener('keydown', unlockAudio);

      // 点击画布开始游戏（标题画面）
      canvas.addEventListener('click', function () {
        if (GameEngine.getState().proc === 100) {
          GameEngine.startGame();
        }
      });

      // 标题提示
      var titleShown = false;
      setInterval(function () {
        if (GameEngine.getState) {
          var s = GameEngine.getState();
          if (s.proc === 100 && !titleShown) {
            titleShown = true;
            hint.textContent = '← → 移动   ↑/空格 跳跃   ↓ 下蹲/进管道';
          } else if (s.proc === 1) {
            hint.textContent = '';
          } else {
            titleShown = false;
          }
        }
      }, 200);

      // ---- 录像：录制 / 下载 / 播放 ----
      (function () {
        if (!GameEngine.Replay) return;
        var recBtn = document.getElementById('recbtn');
        var playBtn = document.getElementById('playrepbtn');
        var picker = document.getElementById('reppicker');

        function pad(n) { return n < 10 ? '0' + n : '' + n; }
        function stamp() {
          var d = new Date();
          return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
                 '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
        }
        function download(file) {
          var blob = new Blob([JSON.stringify(file)], { type: 'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'catmario-replay-' + stamp() + '.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        }

        recBtn.addEventListener('click', function () {
          var st = GameEngine.Replay.status();
          if (st.mode === 'record' || st.mode === 'recorded') {
            var out = GameEngine.Replay.stopRecord();
            if (out.ok) download(out.file);
            else alert(out.error || '停止录制失败');
          } else if (st.mode === 'off') {
            if (GameEngine.getState().proc !== 100) {
              alert('只有在标题画面（游戏尚未开始）才能启动录制');
              return;
            }
            var r = GameEngine.Replay.beginRecord({ date: new Date().toISOString() });
            if (!r.ok) alert(r.error || '录制启动失败');
          }
        });

        playBtn.addEventListener('click', function () {
          var st = GameEngine.Replay.status();
          if (st.mode === 'play') {
            GameEngine.Replay.stopPlay();
          } else if (st.mode === 'ended' || st.mode === 'error') {
            GameEngine.Replay.stopPlay();
          } else if (st.mode === 'off') {
            picker.value = '';
            picker.click();
          }
        });

        picker.addEventListener('change', function () {
          var f = picker.files && picker.files[0];
          if (!f) return;
          var reader = new FileReader();
          reader.onload = function () {
            var file;
            try { file = JSON.parse(reader.result); }
            catch (e) { alert('录像文件不是有效的 JSON'); return; }
            var r = GameEngine.Replay.startPlay(file);
            if (!r.ok) alert(r.error || '播放失败');
          };
          reader.readAsText(f);
        });

        // 按钮状态轮询：录制仅标题可启；播放中禁止录制
        setInterval(function () {
          var st = GameEngine.Replay.status();
          var proc = GameEngine.getState().proc;
          if (st.mode === 'record') {
            recBtn.textContent = '■ 停止并下载';
            recBtn.disabled = false;
            playBtn.textContent = '播放中…';
            playBtn.disabled = true;
          } else if (st.mode === 'recorded') {
            recBtn.textContent = '⬇ 下载录像';
            recBtn.disabled = false;
            playBtn.textContent = '📂 播放录像';
            playBtn.disabled = true;
          } else if (st.mode === 'play') {
            recBtn.textContent = '● 录制';
            recBtn.disabled = true;
            playBtn.textContent = '■ 停止播放';
            playBtn.disabled = false;
          } else if (st.mode === 'ended') {
            recBtn.textContent = '● 录制';
            recBtn.disabled = proc !== 100;
            playBtn.textContent = '✓ 播放结束（再点复位）';
            playBtn.disabled = false;
          } else if (st.mode === 'error') {
            recBtn.textContent = '● 录制';
            recBtn.disabled = proc !== 100;
            playBtn.textContent = '✗ 播放出错（点此复位）';
            playBtn.disabled = false;
          } else {
            recBtn.textContent = '● 录制';
            recBtn.disabled = proc !== 100;
            playBtn.textContent = '📂 播放录像';
            playBtn.disabled = false;
          }
        }, 200);
      })();

      // 隐藏加载提示
      setTimeout(function () {
        loading.style.display = 'none';
      }, 500);
    })();
  </script>
</body>
</html>
