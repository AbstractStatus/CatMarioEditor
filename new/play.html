<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- base 指向原版游戏目录：catmario.js / res/ / snd/ 都从那里加载，不修改任何原文件 -->
<base href="../catmario/docs/">
<title>猫里奥 · 自定义关卡试玩</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #16181f; color: #d8dee9; font-family: "Microsoft YaHei", sans-serif; min-height: 100%; }
#bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; background: #232733; border-bottom: 1px solid #333a48;
}
#bar b { color: #ffd75e; margin-right: 6px; }
#bar button {
  background: #313747; color: #d8dee9; border: 1px solid #454d61;
  border-radius: 5px; padding: 5px 10px; font-size: 13px; cursor: pointer;
}
#bar button:hover:not(:disabled) { background: #3d4458; }
#bar button:disabled { opacity: .45; cursor: default; }
#startBtn { background: #2d6cdf !important; border-color: #4a86f0 !important; color: #fff !important; font-weight: bold; }
#status { font-size: 12px; color: #9aa4b8; }
#status.ok { color: #7ddc8a; }
#status.err { color: #ff7d7d; }
#wrap { display: flex; justify-content: center; padding: 14px; }
canvas#canvas {
  background: #000;
  box-shadow: 0 0 24px rgba(0,0,0,.6), 0 0 0 1px #333a48;
  max-width: 96vw;
  outline: none;
}
#info {
  max-width: 760px; margin: 0 auto; padding: 0 16px 20px;
  font-size: 13px; line-height: 1.7; color: #b8c2d6;
}
#info .sec { background: #20242e; border: 1px solid #333a48; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
#info h3 { font-size: 13px; color: #ffd75e; margin-bottom: 6px; }
#skiplist { color: #ffb46b; }
#help { color: #9aa4b8; }
#help kbd {
  background: #313747; border: 1px solid #454d61; border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 6px; font-family: monospace; font-size: 12px; color: #e8ecf4;
}
#dropTip { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(20,40,90,.55); color: #fff; font-size: 22px; pointer-events: none; z-index: 9; }
body.dragging #dropTip { display: flex; }
</style>
</head>
<body>
<div id="bar">
  <b>🐱 猫里奥 · 自定义关卡试玩</b>
  <button id="pickBtn">📂 选择JSON</button>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
  <button id="demoBtn">✨ 内置示例</button>
  <button id="startBtn" disabled>▶ 开始游戏</button>
  <button id="retryBtn" disabled>↺ 回到标题</button>
  <span id="status">正在加载游戏引擎…</span>
</div>

<div id="wrap"><canvas id="canvas" width="480" height="420" tabindex="0"></canvas></div>

<div id="info">
  <div class="sec" id="levelInfoSec">
    <h3>当前关卡</h3>
    <div id="levelInfo">尚未加载关卡（打开本页时若编辑器刚点过"▶ 试玩"，会自动载入那个关卡）</div>
  </div>
  <div class="sec">
    <h3>操作</h3>
    <div id="help">
      <kbd>←</kbd><kbd>→</kbd> 移动　<kbd>↑</kbd>/<kbd>空格</kbd> 跳　<kbd>↓</kbd> 下蹲/进管道　<kbd>Enter</kbd> 暂停/确认<br>
      原理：把编辑器 JSON 转换成原版 17×1001 地图字节，替换游戏内存中 1-1 关的关卡常量后启动原版引擎。
      关卡通关后会接原版 1-2；死亡重试仍是你的关卡。
    </div>
  </div>
</div>
<div id="dropTip">松开以加载关卡 JSON</div>

<script src="../../new/stage11_data.js"></script>
<script src="../../new/soundpatch.js"></script>
<script async src="catmario.js"></script>
<script>
(function () {
  'use strict';

  /* ================= 关卡转换：编辑器 JSON → 原版数据 =================
   * 通道一（字节表 stagedate）：1-19方块/9金币/20升降台/30中间旗/
   *   40-44管道/50-79敌人/80-89背景/99终点杆（见 stage() main.cpp 4075）
   * 通道二（运行时数组，本页 JS 注入）：
   *   特殊方块 ttype>=100 → tyobi 等效写入 t[] 数组（只占 ta/tb/ttype 三字段）
   *   特殊敌人/道具 → 敌人触发器 b[] 数组（ba/bb/bz=1/btm=0/btype/bxtype），
   *   玩家进入屏幕时引擎自动 ayobi() 生成，支持任意 atype（100蘑菇/110星/
   *   30小猫/31肌肉鸡/80云/83刺球/85假杆/86桃猫/90光束/87火焰棒…）
   */
  var TILE_VAL = {
    block_brick: 1, block_question: 2, block_hard: 3, block_stair: 4,
    block_ground_top: 5, block_ground_fill: 6, block_hidden: 7, block_cat_shut: 8,
    item_coin: 9, block_spike: 10,
    bg_midflag: 30, pipe_top: 40, pipe_body: 41, pipe_v2: 43, pipe_h: 44,
    lift_yellow: 20, lift_green: 20, lift_gray: 20,
    enemy_syobon: 50, enemy_turtle: 51, enemy_shell: 52, enemy_ghost: 53, enemy_king: 54,
    enemy_tongue_cat: 55, enemy_robot: 56, enemy_syobon_pad: 57, enemy_runner: 58, enemy_flame: 59,
    bg_hill_house: 80, bg_grass: 81, bg_cloud_face: 82, bg_tree: 83,
    bg_cloud_angry: 84, bg_tree_round: 85, bg_lava: 86
  };

  // 通道二 A：特殊方块 → tyobi ttype
  var EX_BLOCK = {
    b2_hint: 300, b2_pswitch: 400, b2_on: 130, b2_off: 131,
    b2_note_peach: 117, b2_note_white: 117,
    b2_sword: 140, b2_blade: 141, b2_pineapple: 142, item_jumppad: 120,
    // 问号块的道具变体（ttype 决定顶出内容）
    block_q_mushroom: 100, block_q_enemy: 101, block_q_poison: 102,
    block_q_poison_mass: 103, block_q_coin_mass: 112, block_q_badstar: 110
  };

  // 通道二 B：敌人/道具 → 触发器 btype（=生成的 atype）, bxtype
  var EX_TRIGGER = {
    item_mushroom_red:    { t: 100, xt: 0 },
    item_mushroom_dark:   { t: 100, xt: 1 },
    item_flower:          { t: 101, xt: 0 },
    item_mushroom_purple: { t: 102, xt: 1 },
    item_green_question:  { t: 105, xt: 0 },
    item_star:            { t: 110, xt: 0 },
    enemy_flame_h:        { t: 10,  xt: 0 },
    enemy_moralar:        { t: 30,  xt: 0 },
    enemy_chicken:        { t: 31,  xt: 0 },
    enemy_cloud_face:     { t: 80,  xt: 0 },
    enemy_cloud_plain:    { t: 81,  xt: 0 },
    enemy_spike_ball:     { t: 83,  xt: 0 },
    enemy_fireball:       { t: 84,  xt: 0 },
    fake_pole:            { t: 85,  xt: 0 },
    enemy_peach_cat:      { t: 86,  xt: 0 },
    enemy_beam:           { t: 90,  xt: 0 },
    firebar:              { t: 87,  xt: 5 }
  };

  var BGM_FILE = {
    bgm_field: 'snd/field.mp3', bgm_dungeon: 'snd/dungeon.mp3',
    bgm_star: 'snd/star4.mp3', bgm_castle: 'snd/castle.mp3', bgm_puyo: 'snd/puyo.mp3'
  };

  // 通道二 C：非字节表实体（陷阱管道等）→ sa/sb/sc/sd/stype/sxtype
  var EX_TRAP = {
    // 陷阱管道：sa 需 +500 偏移、sc=tw*3000（非 -100）
    // 所有管道动态分配空槽（跳过 28）；slot 28 是"屏外隐藏管道"动画借用槽：
    //   引擎动画代码 main.cpp:1885 硬编码 t=28，玩家进入任一管道后 JS 把
    //   该管道数据搬到 slot 28 播放动画（只对被进入的管道做动画，不联动）
    pipe_trap: { stype: 50, sxtype: 0, tw: 2, th: 4, saOff: 500 }
  };

  var ROWS = 17, COLS = 1001;

  function convert(level) {
    if (!level || !Array.isArray(level.elements))
      throw new Error('JSON 格式不正确：缺少 elements 数组');
    var grid = new Uint8Array(ROWS * COLS);
    var blocks = [];    // {x,y,ttype} 写入 t[]
    var triggers = [];  // {x,y,btype,bxtype} 写入 b[]
    var traps = [];     // {x,y,w,h,stype,sxtype} 写入 sa[]/sb[]/sc[]/sd[]/stype[]/sxtype[]
    var bgms = [];      // {col,file}
    var spawn = null;
    var skip = {};
    var used = 0;

    function put(r, c, v) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      grid[r * COLS + c] = v;
      return true;
    }

    level.elements.forEach(function (e) {
      if (!e || typeof e.id !== 'string') return;
      var id = e.id;
      var c = e.col | 0, r = e.row | 0;
      var x = c * 29, y = r * 29 - 12;   // 与 stage() 的世界坐标一致
      if (id === 'goal_pole') {
        if (r > 11) r = 11;               // 杆高=(12-行)*29px
        put(r, c, 99); used++;
      } else if (TILE_VAL[id] !== undefined) {
        var v = TILE_VAL[id];
        if (id.indexOf('lift_') === 0) {
          var len = Math.max(1, Math.min(e.len | 0 || 3, 50));
          for (var i = 0; i < len; i++) { if (put(r, c + i, v)) used++; }
        } else if (put(r, c, v)) used++;
      } else if (EX_BLOCK[id] !== undefined) {
        blocks.push({ x: x * 100, y: y * 100, ttype: EX_BLOCK[id] });
      } else if (EX_TRIGGER[id] !== undefined) {
        var sp = EX_TRIGGER[id];
        var xt = (id === 'firebar') ? (e.xt || sp.xt) : sp.xt;
        triggers.push({ x: x * 100, y: y * 100, btype: sp.t, bxtype: xt });
      } else if (EX_TRAP[id] !== undefined) {
        // 非字节表实体（如陷阱管道 stype=50），通过 sa[] 数组运行时注入
        var sp2 = EX_TRAP[id];
        traps.push({
          x: x * 100 + (sp2.saOff || 0), y: y * 100,
          w: sp2.tw * 3000, h: sp2.th * 3000 - 200,
          stype: sp2.stype, sxtype: e.sxtype || sp2.sxtype || 0,
          slot: sp2.slot
        });
      } else if (id === 'player_start') {
        spawn = { x: x, y: y };
      } else if (BGM_FILE[id]) {
        bgms.push({ col: c, file: BGM_FILE[id] });
      } else {
        skip[id] = (skip[id] || 0) + 1;
      }
    });
    bgms.sort(function (a, b) { return a.col - b.col; });
    return {
      bytes: grid, blocks: blocks, triggers: triggers, traps: traps, bgms: bgms,
      spawn: spawn, skip: skip, used: used
    };
  }

  /* ================= 内存补丁：替换 1-1 关卡常量 ================= */
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function patchMemory(bytes) {
    var heap = Module.HEAPU8;
    if (!heap) return { ok: false, msg: '无法访问引擎内存（Module.HEAPU8 不存在）' };
    var orig = b64ToBytes(window.STAGE11_IMAGE_B64);
    // 选取权重最高的 16 字节窗口作探针（非零最多、最独特）
    var best = 0, bestScore = -1;
    for (var off = 0; off + 16 <= orig.length; off += 16) {
      var s = 0;
      for (var j = 0; j < 16; j++) s += orig[off + j];
      if (s > bestScore) { bestScore = s; best = off; }
    }
    var probe = orig.subarray(best, best + 16);
    var H = heap.length, n = orig.length;

    // 快扫探针
    var cands = [];
    for (var i = 0; i + n <= H; i++) {
      if (heap[i] !== probe[0]) continue;
      var ok = true;
      for (var k = 1; k < 16; k++) {
        if (heap[i + k] !== probe[k]) { ok = false; break; }
      }
      if (ok) { cands.push(i); i += 15; }
    }
    // 逐一完整校验并替换
    var hits = 0;
    for (var m = 0; m < cands.length; m++) {
      var pos = cands[m] - best;
      if (pos < 0 || pos + n > H) continue;
      var same = true;
      for (var p = 0; p < n; p += 1) {
        if (heap[pos + p] !== orig[p]) { same = false; break; }
      }
      if (!same) continue;
      heap.set(bytes, pos);
      hits++;
    }
    return hits > 0
      ? { ok: true, msg: '已替换内存中 ' + hits + ' 处 1-1 关卡数据' }
      : { ok: false, msg: '未在引擎内存中找到 1-1 关卡指纹（引擎版本不符？）' };
  }

  /* ================= 运行时实体注入（通道二） =================
   * 引擎主循环全量遍历各实体数组，靠哨兵值判活（ta/ba=-9000000 为空）。
   * 字段在 asm.js 静态内存中的位置以实测为准（与 C 源码声明顺序略有差异）：
   *   t[]（方块，步长641）：k0=ta, k1=tb, k3=ttype（k2/k4/k5 为内部字段）
   *   b[]（触发器，步长81）：k0=ba, k1=bb, k2=btm, k3=btype, k4=bxtype, k5=bz
   * 定位用 1-1 固定陷阱块/触发器的常量签名（stagep 每次进关都会无条件写入，
   * 不随自定义关卡数据变化），并对签名做严格校验，失败绝不写入。
   */
  var MEM = null;   // { ta, tb, ttype, ba, bb, btm, btype, bxtype, bz, ma, mb }
  var SENTINEL = -9000000;
  // slot 28 屏外隐藏管道坐标（约 3 万格之外，渲染/碰撞均不可达）
  var TRAP28_HIDDEN = 9999999;
  // 陷阱管道动画借用状态：引擎动画硬编码 slot 28（main.cpp:1885 t=28），
  // 玩家进入任一管道后把该管道数据搬到 slot 28 播放动画，结束后恢复
  var flyState = null;   // { slot, base, frames } 或 null
  // 下沉签名追踪（fx 定位失败时的兜底）：引擎沉入段 mtm1-16 每帧恰好 mb+=240
  // 且 ma 不变（mxtype==0 分支 mc=0），自然下坠为加速度曲线不可能连续多帧恰好 +240
  var sinkMa = -1, sinkMb = -1, sinkN = 0;

  function locateRuntimeArrays() {
    var u8 = Module.HEAPU8;
    if (!u8) return null;
    var u32 = new Int32Array(u8.buffer);
    var T = 641, B = 81;

    // t[] 基址：1-1 固定特殊块连续 4 个 ta 签名（cols 8,13,14,35）
    var pT = -1;
    for (var p = 0; p + T * 6 < u32.length; p++) {
      if (u32[p] === 8 * 2900 && u32[p + 1] === 13 * 2900 &&
          u32[p + 2] === 14 * 2900 && u32[p + 3] === 35 * 2900) {
        // 校验：tb(row9) 与 ttype(k=3) 常量序列
        if (u32[p + T] === (9 * 29 - 12) * 100 &&
            u32[p + 3 * T] === 100 && u32[p + 3 * T + 1] === 102 &&
            u32[p + 3 * T + 2] === 101 && u32[p + 3 * T + 3] === 110) {
          pT = p;
          break;
        }
      }
    }
    if (pT < 0) return null;

    // b[] 基址：1-1 固定触发器 ba[0]=27列, ba[1]=103列，且 btype(k=3)[1]=80
    var pB = -1;
    for (var q = 0; q + B * 6 < u32.length; q++) {
      if (u32[q] === 27 * 2900 && u32[q + 1] === 103 * 2900 &&
          u32[q + 3 * B] === 0 && u32[q + 3 * B + 1] === 80 &&
          u32[q + 5 * B] === 1) {
        pB = q;
        break;
      }
    }
    if (pB < 0) return null;

    // 玩家出生坐标 ma/mb：进关首帧为 ma=5600, mb=32000（相邻两格）。
    // 注入帧玩家已开始下坠（mb 递增），故 mb 用放宽区间，且要求全堆唯一
    // 匹配，避免命中静态数据的假对（假对会让 spawn/动画借用全部失效）
    var maAddr = -1;
    var maHits = 0;
    for (var i = 0; i + 1 < u32.length; i++) {
      if (u32[i] === 5600 && u32[i + 1] >= 32000 && u32[i + 1] <= 33400) {
        maHits++;
        if (maAddr < 0) maAddr = i;
      }
    }
    if (maHits !== 1) maAddr = -1;   // 非唯一匹配视为不可靠

    // 相机世界 x（fx）：进关瞬间 fx=fy=fzx=fzy=0 且 scrollx=360000（1-1 固定，
    // main.cpp:1656/4135），五连签名 (0,0,0,0,360000) 全堆唯一匹配 → fx 地址。
    // 关键：ma 是屏幕相对坐标（滚动时被钳制、位移累进 fx），碰撞里 xx[8]=sa[t]-fx
    // 与 ma 同系对比；玩家世界 x = fx + ma（main.cpp:3776 scorepos=fx+ma 实证）。
    // 之前借用逻辑拿屏幕 ma 直接对比世界坐标 baseSa → 永远匹配不上 → 完全没动画。
    var fxa = -1;
    var fxHits = 0;
    for (var f = 0; f + 5 < u32.length; f++) {
      if (u32[f] === 0 && u32[f + 1] === 0 && u32[f + 2] === 0 &&
          u32[f + 3] === 0 && u32[f + 4] === 360000) {
        fxHits++;
        if (fxa < 0) fxa = f;
      }
    }
    if (fxHits !== 1) fxa = -1;   // 非唯一匹配视为不可靠（走下沉签名兜底）

    MEM = {
      ta: pT, tb: pT + T, ttype: pT + 3 * T,
      ba: pB, bb: pB + B, btm: pB + 2 * B,
      btype: pB + 3 * B, bxtype: pB + 4 * B, bz: pB + 5 * B,
      ma: maAddr, mb: maAddr >= 0 ? maAddr + 1 : -1,
      fx: fxa,
      sa: -1, sb: -1, sc: -1, sd: -1, stype: -1, sxtype: -1
    };

    // sa/sb/sc/sd/stype/sxtype 数组：连续分配，各 smax=31 个 int32
    // 优先用 stagep() 无条件写入的滚动实体签名定位
    // （sa[0]=20*29*100+500=58500, sb[0]=-6000, stype[0]=100, stype[1]=101）
    for (var p = 0; p + 155 < u32.length; p++) {
      if (u32[p] === 58500 && u32[p + 31] === -6000 &&
          u32[p + 124] === 100 && u32[p + 125] === 101 &&
          u32[p + 126] === 102 && u32[p + 127] === 103) {
        MEM.sa = p; MEM.sb = p + 31; MEM.sc = p + 62;
        MEM.sd = p + 93; MEM.stype = p + 124; MEM.sxtype = p + 155;
        break;
      }
    }
    // 后备 1：col20 管道上口签名（自定义关卡有 col20 管道时）
    if (MEM.sa < 0) {
      for (var p = 0; p + 155 < u32.length; p++) {
        if (u32[p] === 58000 && u32[p + 31] === 27800 &&
            u32[p + 62] === 6000 && u32[p + 93] === 3000 && u32[p + 124] === 1) {
          MEM.sa = p; MEM.sb = p + 31; MEM.sc = p + 62;
          MEM.sd = p + 93; MEM.stype = p + 124; MEM.sxtype = p + 155;
          break;
        }
      }
    }
    // 后备 2：哨兵模式（stagep 未运行时）
    if (MEM.sa < 0) {
      var KNOWN_ST = [0,1,2,50,51,52,100,101,102,103,300,500];
      for (var p = 0; p + 155 < u32.length; p++) {
        if (u32[p] !== SENTINEL && u32[p + 31] !== SENTINEL) continue;
        var saCnt = 0, stCnt = 0, bad = false;
        for (var q = 0; q < 31; q++) {
          if (u32[p + q] === SENTINEL) saCnt++;
          var st = u32[p + 124 + q];
          if (st === SENTINEL) stCnt++;
          else {
            var known = false;
            for (var s = 0; s < KNOWN_ST.length; s++) { if (st === KNOWN_ST[s]) { known = true; break; } }
            if (!known) { bad = true; break; }
          }
        }
        if (bad || saCnt < 20 || stCnt < 20) continue;
        MEM.sa = p; MEM.sb = p + 31; MEM.sc = p + 62;
        MEM.sd = p + 93; MEM.stype = p + 124; MEM.sxtype = p + 155;
        break;
      }
    }
    return MEM;
  }

  // 每关（含死亡重试）重建数组后重新注入
  function injectExtras(conv) {
    var u32 = new Int32Array(Module.HEAPU8.buffer);
    var n;

    // A. 特殊方块（等效 tyobi：ta/tb/ttype）
    var wroteBlocks = 0, overflowBlocks = 0;
    for (var i = 0; i < conv.blocks.length; i++) {
      var slot = -1;
      for (n = 0; n < 641; n++) {
        if (u32[MEM.ta + n] === SENTINEL) { slot = n; break; }
      }
      if (slot < 0) { overflowBlocks++; continue; }
      var b = conv.blocks[i];
      u32[MEM.ta + slot] = b.x;
      u32[MEM.tb + slot] = b.y;
      u32[MEM.ttype + slot] = b.ttype;

        u32[MEM.sc + tslot] = tp.w;
        u32[MEM.sd + tslot] = tp.h;
        u32[MEM.stype + tslot] = tp.stype;
