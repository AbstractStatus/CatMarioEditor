<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- base 指向原版游戏目录：catmario.js / res/ / snd/ 都从那里加载，不修改任何原文件 -->
<base href="../catmario/docs/">
<title>猫里奥 · 自定义关卡试玩</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #16181f; color: #d8dee9; font-family: "Microsoft YaHei", sans-serif; min-height: 100%; }
#bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; background: #232733; border-bottom: 1px solid #333a48;
}
#bar b { color: #ffd75e; margin-right: 6px; }
#bar button {
  background: #313747; color: #d8dee9; border: 1px solid #454d61;
  border-radius: 5px; padding: 5px 10px; font-size: 13px; cursor: pointer;
}
#bar button:hover:not(:disabled) { background: #3d4458; }
#bar button:disabled { opacity: .45; cursor: default; }
#startBtn { background: #2d6cdf !important; border-color: #4a86f0 !important; color: #fff !important; font-weight: bold; }
#status { font-size: 12px; color: #9aa4b8; }
#status.ok { color: #7ddc8a; }
#status.err { color: #ff7d7d; }
#wrap { display: flex; justify-content: center; padding: 14px; }
canvas#canvas {
  background: #000;
  box-shadow: 0 0 24px rgba(0,0,0,.6), 0 0 0 1px #333a48;
  max-width: 96vw;
  outline: none;
}
#info {
  max-width: 760px; margin: 0 auto; padding: 0 16px 20px;
  font-size: 13px; line-height: 1.7; color: #b8c2d6;
}
#info .sec { background: #20242e; border: 1px solid #333a48; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
#info h3 { font-size: 13px; color: #ffd75e; margin-bottom: 6px; }
#skiplist { color: #ffb46b; }
#help { color: #9aa4b8; }
#help kbd {
  background: #313747; border: 1px solid #454d61; border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 6px; font-family: monospace; font-size: 12px; color: #e8ecf4;
}
#dropTip { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(20,40,90,.55); color: #fff; font-size: 22px; pointer-events: none; z-index: 9; }
body.dragging #dropTip { display: flex; }
</style>
</head>
<body>
<div id="bar">
  <b>🐱 猫里奥 · 自定义关卡试玩</b>
  <button id="pickBtn">📂 选择JSON</button>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
  <button id="demoBtn">✨ 内置示例</button>
  <button id="startBtn" disabled>▶ 开始游戏</button>
  <button id="retryBtn" disabled>↺ 回到标题</button>
  <span id="status">正在加载游戏引擎…</span>
</div>

<div id="wrap"><canvas id="canvas" width="480" height="420" tabindex="0"></canvas></div>

<div id="info">
  <div class="sec" id="levelInfoSec">
    <h3>当前关卡</h3>
    <div id="levelInfo">尚未加载关卡（打开本页时若编辑器刚点过"▶ 试玩"，会自动载入那个关卡）</div>
  </div>
  <div class="sec">
    <h3>操作</h3>
    <div id="help">
      <kbd>←</kbd><kbd>→</kbd> 移动　<kbd>↑</kbd>/<kbd>空格</kbd> 跳　<kbd>↓</kbd> 下蹲/进管道　<kbd>Enter</kbd> 暂停/确认<br>
      原理：把编辑器 JSON 转换成原版 17×1001 地图字节，替换游戏内存中 1-1 关的关卡常量后启动原版引擎。
      关卡通关后会接原版 1-2；死亡重试仍是你的关卡。
    </div>
  </div>
</div>
<div id="dropTip">松开以加载关卡 JSON</div>

<script src="../../new/stage11_data.js"></script>
<script src="../../new/soundpatch.js"></script>
<script async src="catmario.js"></script>
<script>
(function () {
  'use strict';

  /* ================= 关卡转换：编辑器 JSON → 原版数据 =================
   * 通道一（字节表 stagedate）：1-19方块/9金币/20升降台/30中间旗/
   *   40-44管道/50-79敌人/80-89背景/99终点杆（见 stage() main.cpp 4075）
   * 通道二（运行时数组，本页 JS 注入）：
   *   特殊方块 ttype>=100 → tyobi 等效写入 t[] 数组（只占 ta/tb/ttype 三字段）
   *   特殊敌人/道具 → 敌人触发器 b[] 数组（ba/bb/bz=1/btm=0/btype/bxtype），
   *   玩家进入屏幕时引擎自动 ayobi() 生成，支持任意 atype（100蘑菇/110星/
   *   30小猫/31肌肉鸡/80云/83刺球/85假杆/86桃猫/90光束/87火焰棒…）
   */
  var TILE_VAL = {
    block_brick: 1, block_question: 2, block_hard: 3, block_stair: 4,
    block_ground_top: 5, block_ground_fill: 6, block_hidden: 7, block_cat_shut: 8,
    item_coin: 9, block_spike: 10,
    bg_midflag: 30, pipe_top: 40, pipe_body: 41, pipe_v2: 43, pipe_h: 44,
    lift_yellow: 20, lift_green: 20, lift_gray: 20,
    enemy_syobon: 50, enemy_turtle: 51, enemy_shell: 52, enemy_ghost: 53, enemy_king: 54,
    enemy_tongue_cat: 55, enemy_robot: 56, enemy_syobon_pad: 57, enemy_runner: 58, enemy_flame: 59,
    bg_hill_house: 80, bg_grass: 81, bg_cloud_face: 82, bg_tree: 83,
    bg_cloud_angry: 84, bg_tree_round: 85, bg_lava: 86
  };

  // 通道二 A：特殊方块 → tyobi ttype
  var EX_BLOCK = {
    b2_hint: 300, b2_pswitch: 400, b2_on: 130, b2_off: 131,
    b2_note_peach: 117, b2_note_white: 117,
    b2_sword: 140, b2_blade: 141, b2_pineapple: 142, item_jumppad: 120,
    // 问号块的道具变体（ttype 决定顶出内容）
    block_q_mushroom: 100, block_q_enemy: 101, block_q_poison: 102,
    block_q_poison_mass: 103, block_q_coin_mass: 112, block_q_badstar: 110
  };

  // 通道二 B：敌人/道具 → 触发器 btype（=生成的 atype）, bxtype
  var EX_TRIGGER = {
    item_mushroom_red:    { t: 100, xt: 0 },
    item_mushroom_dark:   { t: 100, xt: 1 },
    item_flower:          { t: 101, xt: 0 },
    item_mushroom_purple: { t: 102, xt: 1 },
    item_green_question:  { t: 105, xt: 0 },
    item_star:            { t: 110, xt: 0 },
    enemy_flame_h:        { t: 10,  xt: 0 },
    enemy_moralar:        { t: 30,  xt: 0 },
    enemy_chicken:        { t: 31,  xt: 0 },
    enemy_cloud_face:     { t: 80,  xt: 0 },
    enemy_cloud_plain:    { t: 81,  xt: 0 },
    enemy_spike_ball:     { t: 83,  xt: 0 },
    enemy_fireball:       { t: 84,  xt: 0 },
    fake_pole:            { t: 85,  xt: 0 },
    enemy_peach_cat:      { t: 86,  xt: 0 },
    enemy_beam:           { t: 90,  xt: 0 },
    firebar:              { t: 87,  xt: 5 }
  };

  var BGM_FILE = {
    bgm_field: 'snd/field.mp3', bgm_dungeon: 'snd/dungeon.mp3',
    bgm_star: 'snd/star4.mp3', bgm_castle: 'snd/castle.mp3', bgm_puyo: 'snd/puyo.mp3'
  };

  // 通道二 C：非字节表实体（陷阱管道等）→ sa/sb/sc/sd/stype/sxtype
  var EX_TRAP = {
    // 陷阱管道：sa 需 +500 偏移、sc=tw*3000（非 -100）
    // 第一个陷阱管道直接放入 slot 28（引擎硬编码动画槽 main.cpp:1885 t=28），
    // 动画在正确坐标上运行。多余管道动态分配空槽（仅声效，无动画）。
    pipe_trap: { stype: 50, sxtype: 0, tw: 2, th: 4, saOff: 500 }
  };

  var ROWS = 17, COLS = 1001;

  function convert(level) {
    if (!level || !Array.isArray(level.elements))
      throw new Error('JSON 格式不正确：缺少 elements 数组');
    var grid = new Uint8Array(ROWS * COLS);
    var blocks = [];    // {x,y,ttype} 写入 t[]
    var triggers = [];  // {x,y,btype,bxtype} 写入 b[]
    var traps = [];     // {x,y,w,h,stype,sxtype} 写入 sa[]/sb[]/sc[]/sd[]/stype[]/sxtype[]
    var bgms = [];      // {col,file}
    var spawn = null;
    var skip = {};
    var used = 0;

    function put(r, c, v) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      grid[r * COLS + c] = v;
      return true;
    }

    level.elements.forEach(function (e) {
      if (!e || typeof e.id !== 'string') return;
      var id = e.id;
      var c = e.col | 0, r = e.row | 0;
      var x = c * 29, y = r * 29 - 12;   // 与 stage() 的世界坐标一致
      if (id === 'goal_pole') {
        if (r > 11) r = 11;               // 杆高=(12-行)*29px
        put(r, c, 99); used++;
      } else if (TILE_VAL[id] !== undefined) {
        var v = TILE_VAL[id];
        if (id.indexOf('lift_') === 0) {
          var len = Math.max(1, Math.min(e.len | 0 || 3, 50));
          for (var i = 0; i < len; i++) { if (put(r, c + i, v)) used++; }
        } else if (put(r, c, v)) used++;
      } else if (EX_BLOCK[id] !== undefined) {
        blocks.push({ x: x * 100, y: y * 100, ttype: EX_BLOCK[id] });
      } else if (EX_TRIGGER[id] !== undefined) {
        var sp = EX_TRIGGER[id];
        var xt = (id === 'firebar') ? (e.xt || sp.xt) : sp.xt;
        triggers.push({ x: x * 100, y: y * 100, btype: sp.t, bxtype: xt });
      } else if (EX_TRAP[id] !== undefined) {
        // 非字节表实体（如陷阱管道 stype=50），通过 sa[] 数组运行时注入
        var sp2 = EX_TRAP[id];
        traps.push({
          x: x * 100 + (sp2.saOff || 0), y: y * 100,
          w: sp2.tw * 3000, h: sp2.th * 3000 - 200,
          stype: sp2.stype, sxtype: e.sxtype || sp2.sxtype || 0,
          slot: sp2.slot
        });
      } else if (id === 'player_start') {
        spawn = { x: x, y: y };
      } else if (BGM_FILE[id]) {
        bgms.push({ col: c, file: BGM_FILE[id] });
      } else {
        skip[id] = (skip[id] || 0) + 1;
      }
    });
    bgms.sort(function (a, b) { return a.col - b.col; });
    return {
      bytes: grid, blocks: blocks, triggers: triggers, traps: traps, bgms: bgms,
      spawn: spawn, skip: skip, used: used
    };
  }

  /* ================= 内存补丁：替换 1-1 关卡常量 ================= */
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function patchMemory(bytes) {
    var heap = Module.HEAPU8;
    if (!heap) return Promise.resolve({ ok: false, msg: '无法访问引擎内存（Module.HEAPU8 不存在）' });
    var orig = b64ToBytes(window.STAGE11_IMAGE_B64);
    // 选取权重最高的 16 字节窗口作探针（非零最多、最独特）
    var best = 0, bestScore = -1;
    for (var off = 0; off + 16 <= orig.length; off += 16) {
      var s = 0;
      for (var j = 0; j < 16; j++) s += orig[off + j];
      if (s > bestScore) { bestScore = s; best = off; }
    }
    var probe = orig.subarray(best, best + 16);
    var H = heap.length, n = orig.length;

    // 策略一：完整连续匹配（引擎内可能存在运行时连续副本）
    var hits = 0;
    (function () {
      var cands = [];
      for (var i = 0; i + n <= H; i++) {
        if (heap[i] !== probe[0]) continue;
        var ok = true;
        for (var k = 1; k < 16; k++) {
          if (heap[i + k] !== probe[k]) { ok = false; break; }
        }
        if (ok) { cands.push(i); i += 15; }
      }
      for (var m = 0; m < cands.length; m++) {
        var pos = cands[m] - best;
        if (pos < 0 || pos + n > H) continue;
        var same = true;
        for (var p = 0; p < n; p += 1) {
          if (heap[pos + p] !== orig[p]) { same = false; break; }
        }
        if (!same) continue;
        heap.set(bytes, pos);
        hits++;
      }
    })();
    if (hits > 0) return Promise.resolve({ ok: true, msg: '已替换内存中 ' + hits + ' 处 1-1 关卡数据' });

    // 策略二：引擎 stagedatex 在 asm.js 中按 allocate() 分块写入静态内存
    // （各块地址不连续，完整镜像不连续），解析 catmario.js 的 allocate 块，
    // 按"块→镜像偏移"映射逐块定位并替换重叠段。
    if (!__engBlocksP) {
      __engBlocksP = fetch('catmario.js').then(function (r) { return r.text(); })
        .then(function (t) {
          var blocks = [], re = /allocate\(\[([\d,]*)\],"i8",ALLOC_NONE,Runtime\.GLOBAL_BASE\+\d+\)/g, m;
          while ((m = re.exec(t))) {
            var parts = m[1] ? m[1].split(',') : [];
            if (!parts.length) continue;
            var arr = new Uint8Array(parts.length);
            for (var i = 0; i < parts.length; i++) arr[i] = +parts[i];
            blocks.push(arr);
          }
          return blocks;
        });
      __engBlocksP.catch(function () { __engBlocksP = null; }); // 失败允许重试
    }
    return __engBlocksP.then(function (blocks) {
      // 找与镜像对齐的块（扩展法），在 HEAP 中完整块定位，推算镜像基址
      var baseVotes = {};
      for (var b = 0; b < blocks.length; b++) {
        var blk = blocks[b], bl = blk.length;
        if (bl < 16) continue;
        var mo = -1; // 块↔镜像对齐偏移
        for (var w = 0; w + 16 <= bl && mo < 0; w += 16) {
          for (var q = 0; q + 16 <= n; q++) {
            if (orig[q] !== blk[w]) continue;
            var eq = true;
            for (var k = 1; k < 16; k++) { if (orig[q + k] !== blk[w + k]) { eq = false; break; } }
            if (!eq) continue;
            var qs = q, qe = q + 16, bs2 = w, be = w + 16;
            while (qs > 0 && bs2 > 0 && blk[bs2 - 1] === orig[qs - 1]) { qs--; bs2--; }
            while (qe < n && be < bl && blk[be] === orig[qe]) { qe++; be++; }
            if (qe - qs >= 16) { mo = qs; break; }
          }
        }
        if (mo < 0) continue;
        // 重叠段需含非零字节（防全零块误配）
        var hasNZ = false;
        for (var p = Math.max(0, -mo); p < Math.min(bl, n - mo); p++) {
          if (orig[mo + p] !== 0) { hasNZ = true; break; }
        }
        if (!hasNZ) continue;
        var positions = findBlockInHeap(heap, blk);
        for (var pi = 0; pi < positions.length; pi++) {
          var base = positions[pi] - mo;
          baseVotes[base] = (baseVotes[base] || 0) + 1;
        }
      }
      var bases = Object.keys(baseVotes).filter(function (k) { return baseVotes[k] >= 1; });
      if (!bases.length) return { ok: false, msg: '未在引擎内存中找到 1-1 关卡指纹（引擎版本不符？）' };

      var segs = 0, notes = [];
      for (var bi = 0; bi < bases.length; bi++) {
        var base = +bases[bi];
        if (base < 0 || base + n > H) continue;
        // 逐字节 diff：只替换与原版镜像一致的字节，避免破坏挤进间隙的其他变量
        var mismatch = 0, first = -1, last = -1;
        for (var d = 0; d < n; d++) {
          if (heap[base + d] !== orig[d]) { mismatch++; if (first < 0) first = d; last = d; }
        }
        if (mismatch === 0) {
          heap.set(bytes, base);
          segs++;
        } else if (mismatch < n / 4) {
          // 少量不匹配（间隙被占用）：跳过不匹配字节，其余照常替换
          var wrote = 0;
          for (var d2 = 0; d2 < n; d2++) {
            if (heap[base + d2] !== orig[d2]) continue;
            heap[base + d2] = bytes[d2];
            wrote++;
          }
          notes.push('基址' + base + '跳过' + mismatch + '字节(' + first + '-' + last + ')');
          if (wrote > 0) segs++;
        }
      }
      return segs > 0
        ? { ok: true, msg: '已按引擎数据块替换 ' + segs + ' 段 1-1 关卡数据' + (notes.length ? '（' + notes.join('; ') + '）' : '') }
        : { ok: false, msg: '找到候选基址但数据校验不符（引擎版本不符？）' };
    });
  }

  var __engBlocksP = null;
  // 在 heap 中找 block 的全部完整出现位置（探针快扫 + 完整块校验）
  function findBlockInHeap(heap, block) {
    var H = heap.length, bn = block.length;
    var ps = 0;
    for (var off = 0; off + 16 <= bn; off += 16) {
      var s = 0;
      for (var j = 0; j < 16; j++) s += block[off + j];
      if (s > 0) { ps = off; break; }
    }
    var out = [];
    for (var i = 0; i + bn <= H; i++) {
      if (heap[i] !== block[ps]) continue;
      var ok = true;
      for (var k = 0; k < 16; k++) {
        if (heap[i + k] !== block[ps + k]) { ok = false; break; }
      }
      if (!ok) continue;
      var pos = i - ps;
      if (pos < 0 || pos + bn > H) continue;
      var same = true;
      for (var p = 0; p < bn; p++) { if (heap[pos + p] !== block[p]) { same = false; break; } }
      if (same) { out.push(pos); i = pos + bn - 1; }
    }
    return out;
  }

  /* ================= 运行时实体注入（通道二） =================
   * 引擎主循环全量遍历各实体数组，靠哨兵值判活（ta/ba=-9000000 为空）。
   * 字段在 asm.js 静态内存中的位置以实测为准（与 C 源码声明顺序略有差异）：
   *   t[]（方块，步长641）：k0=ta, k1=tb, k3=ttype（k2/k4/k5 为内部字段）
   *   b[]（触发器，步长81）：k0=ba, k1=bb, k2=btm, k3=btype, k4=bxtype, k5=bz
   * 定位用 1-1 固定陷阱块/触发器的常量签名（stagep 每次进关都会无条件写入，
   * 不随自定义关卡数据变化），并对签名做严格校验，失败绝不写入。
   */
  var MEM = null;   // { ta, tb, ttype, ba, bb, btm, btype, bxtype, bz, ma, mb }
  var SENTINEL = -9000000;
  var TRAP28_HIDDEN = 9999999;
  var flyState = null;   // 借用中标记，重生重注入时清空

  // 相机世界 x（fx）动态定位（差值对版）：
  // 引擎恒等式（滚动帧，ma 钳制 mascrollmax=21000 时，main.cpp:3765/3776）：
  //   fzx === fx                  （fx+=xx[5]; fzx+=xx[5]）
  //   scorepos === fx + ma === fx + 21000（scorepos=max(scorepos,fx+ma)）
  // 关卡出生在第一屏之外时，进关 fx 即被引擎设为 66000 等（main.cpp:4107
  // fx=sa[t]-fxmax/2），"进关为 0"的快照假设不成立（实测远端出生时快照
  // 根本抓不到 fx）→ 改用行为识别：窗口内保存上一帧全量快照，滚动帧上
  // 找"本帧递增且当前值差恰为 21000"的地址对 (scorepos, fx)，连续两个
  // 滚动帧出现同一对 → 锁定小地址（fx；其值与 fzx 恒等，锁哪个都一样）。
  var fxPrev = null;     // 窗口上一帧值快照
  var fxPairSeen = null; // 滚动帧上发现的 (scorepos,fx) 差值对计数
  var fxWinLo = 0, fxWinHi = 0;
  function scanFxWindow(u32, maAddr) {
    fxWinLo = (maAddr > 2000) ? maAddr - 2000 : 0;
    fxWinHi = maAddr + 20000;
    fxPrev = null;
    fxPairSeen = null;
    return -1;   // 初始不定位，等待滚动阶段由 refineFxWindow 收敛
  }
  // 每帧收敛：返回定位到的 fx 地址，未收敛返回 -1
  function refineFxWindow(u32, maClamped) {
    if (!MEM || MEM.ma < 0 || fxWinHi <= fxWinLo) return -1;
    var n = fxWinHi - fxWinLo;
    if (!fxPrev) {
      fxPrev = new Int32Array(n);
      for (var i = 0; i < n; i++) fxPrev[i] = u32[fxWinLo + i];
      return -1;
    }
    var found = -1;
    if (maClamped) {
      // 滚动帧：收集"本帧递增且>21000"的地址（值→地址），
      // 再找当前值差恰为 21000 的对（大者为 scorepos，小者为 fx）
      var map = {}, addrs = [];
      for (var j = 0; j < n; j++) {
        var v = u32[fxWinLo + j];
        if (v > fxPrev[j] && v > 21000) {
          map[v] = fxWinLo + j;
          addrs.push(fxWinLo + j);
        }
      }
      if (addrs.length) {
        if (!fxPairSeen) fxPairSeen = {};
        for (var k = 0; k < addrs.length; k++) {
          var pa = addrs[k];
          var qa = map[u32[pa] - 21000];
          if (qa !== undefined) {
            var key = pa + ':' + qa;
            fxPairSeen[key] = (fxPairSeen[key] || 0) + 1;
            if (fxPairSeen[key] >= 2) { found = qa; break; }
          }
        }
      }
    } else {
      fxPairSeen = null;   // 未滚动（钳制前/回走）：对计数清零重来
    }
    // 刷新 prev，保证下一帧递增判断的基准正确
    for (var i2 = 0; i2 < n; i2++) fxPrev[i2] = u32[fxWinLo + i2];
    if (found >= 0) { fxPrev = null; fxPairSeen = null; }
    return found;
  }

  function locateRuntimeArrays() {
    var u8 = Module.HEAPU8;
    if (!u8) return null;
    var u32 = new Int32Array(u8.buffer);
    var T = 641, B = 81;

    // t[] 基址：1-1 固定特殊块连续 4 个 ta 签名（cols 8,13,14,35）
    var pT = -1;
    for (var p = 0; p + T * 6 < u32.length; p++) {
      if (u32[p] === 8 * 2900 && u32[p + 1] === 13 * 2900 &&
          u32[p + 2] === 14 * 2900 && u32[p + 3] === 35 * 2900) {
        // 校验：tb(row9) 与 ttype(k=3) 常量序列
        if (u32[p + T] === (9 * 29 - 12) * 100 &&
            u32[p + 3 * T] === 100 && u32[p + 3 * T + 1] === 102 &&
            u32[p + 3 * T + 2] === 101 && u32[p + 3 * T + 3] === 110) {
          pT = p;
          break;
        }
      }
    }
    if (pT < 0) return null;

    // b[] 基址：1-1 固定触发器 ba[0]=27列, ba[1]=103列，且 btype(k=3)[1]=80
    var pB = -1;
    for (var q = 0; q + B * 6 < u32.length; q++) {
      if (u32[q] === 27 * 2900 && u32[q + 1] === 103 * 2900 &&
          u32[q + 3 * B] === 0 && u32[q + 3 * B + 1] === 80 &&
          u32[q + 5 * B] === 1) {
        pB = q;
        break;
      }
    }
    if (pB < 0) return null;

    // 玩家出生坐标 ma/mb：进关首帧为 ma=5600, mb=32000（相邻两格）。
    // 注入帧玩家已开始下坠（mb 递增），故 mb 用放宽区间，且要求全堆唯一
    // 匹配，避免命中静态数据的假对（假对会让 spawn/动画借用全部失效）
    var maAddr = -1;
    var maHits = 0;
    for (var i = 0; i + 1 < u32.length; i++) {
      if (u32[i] === 5600 && u32[i + 1] >= 32000 && u32[i + 1] <= 33400) {
        maHits++;
        if (maAddr < 0) maAddr = i;
      }
    }
    if (maHits !== 1) maAddr = -1;   // 非唯一匹配视为不可靠

    // 相机世界 x（fx）：签名见 scanFxWindow。
    // 关键：ma 是屏幕相对坐标（滚动时被钳制、位移累进 fx），碰撞里 xx[8]=sa[t]-fx
    // 与 ma 同系对比；玩家世界 x = fx + ma（main.cpp:3776 scorepos=fx+ma 实证）。
    // 之前借用逻辑拿屏幕 ma 直接对比世界坐标 baseSa → 永远匹配不上 → 完全没动画。
    var fxa = (maAddr > 0) ? scanFxWindow(u32, maAddr) : -1;

    MEM = {
      ta: pT, tb: pT + T, ttype: pT + 3 * T,
      ba: pB, bb: pB + B, btm: pB + 2 * B,
      btype: pB + 3 * B, bxtype: pB + 4 * B, bz: pB + 5 * B,
      ma: maAddr, mb: maAddr >= 0 ? maAddr + 1 : -1,
      fx: fxa,
      sa: -1, sb: -1, sc: -1, sd: -1, stype: -1, sxtype: -1
    };

    // sa/sb/sc/sd/stype/sxtype 数组：连续分配，各 smax=31 个 int32
    // 优先用 stagep() 无条件写入的滚动实体签名定位
    // （sa[0]=20*29*100+500=58500, sb[0]=-6000, stype[0]=100, stype[1]=101）
    for (var p = 0; p + 155 < u32.length; p++) {
      if (u32[p] === 58500 && u32[p + 31] === -6000 &&
          u32[p + 124] === 100 && u32[p + 125] === 101 &&
          u32[p + 126] === 102 && u32[p + 127] === 103) {
        MEM.sa = p; MEM.sb = p + 31; MEM.sc = p + 62;
        MEM.sd = p + 93; MEM.stype = p + 124; MEM.sxtype = p + 155;
        break;
      }
    }
    // 后备 1：col20 管道上口签名（自定义关卡有 col20 管道时）
    if (MEM.sa < 0) {
      for (var p = 0; p + 155 < u32.length; p++) {
        if (u32[p] === 58000 && u32[p + 31] === 27800 &&
            u32[p + 62] === 6000 && u32[p + 93] === 3000 && u32[p + 124] === 1) {
          MEM.sa = p; MEM.sb = p + 31; MEM.sc = p + 62;
          MEM.sd = p + 93; MEM.stype = p + 124; MEM.sxtype = p + 155;
          break;
        }
      }
    }
    // 后备 2：哨兵模式（stagep 未运行时）
    if (MEM.sa < 0) {
      var KNOWN_ST = [0,1,2,50,51,52,100,101,102,103,300,500];
      for (var p = 0; p + 155 < u32.length; p++) {
        if (u32[p] !== SENTINEL && u32[p + 31] !== SENTINEL) continue;
        var saCnt = 0, stCnt = 0, bad = false;
        for (var q = 0; q < 31; q++) {
          if (u32[p + q] === SENTINEL) saCnt++;
          var st = u32[p + 124 + q];
          if (st === SENTINEL) stCnt++;
          else {
            var known = false;
            for (var s = 0; s < KNOWN_ST.length; s++) { if (st === KNOWN_ST[s]) { known = true; break; } }
            if (!known) { bad = true; break; }
          }
        }
        if (bad || saCnt < 20 || stCnt < 20) continue;
        MEM.sa = p; MEM.sb = p + 31; MEM.sc = p + 62;
        MEM.sd = p + 93; MEM.stype = p + 124; MEM.sxtype = p + 155;
        break;
      }
    }
    return MEM;
  }

  // 每关（含死亡重试）重建数组后重新注入
  function injectExtras(conv) {
    var u32 = new Int32Array(Module.HEAPU8.buffer);
    var n;

    // A. 特殊方块（等效 tyobi：ta/tb/ttype）
    var wroteBlocks = 0, overflowBlocks = 0;
    for (var i = 0; i < conv.blocks.length; i++) {
      var slot = -1;
      for (n = 0; n < 641; n++) {
        if (u32[MEM.ta + n] === SENTINEL) { slot = n; break; }
      }
      if (slot < 0) { overflowBlocks++; continue; }
      var b = conv.blocks[i];
      u32[MEM.ta + slot] = b.x;
      u32[MEM.tb + slot] = b.y;
      u32[MEM.ttype + slot] = b.ttype;
      wroteBlocks++;
    }

    // B. 敌人/道具触发器（bz=1, btm=0 → 入屏自动 ayobi 生成）
    var wroteTriggers = 0, overflowTriggers = 0;
    for (var k = 0; k < conv.triggers.length; k++) {
      var bslot = -1;
      for (n = 0; n < 81; n++) {
        if (u32[MEM.ba + n] < -80000) { bslot = n; break; }
      }
      if (bslot < 0) { overflowTriggers++; continue; }
      var tg = conv.triggers[k];
      u32[MEM.ba + bslot] = tg.x;
      u32[MEM.bb + bslot] = tg.y;
      u32[MEM.btm + bslot] = 0;
      u32[MEM.btype + bslot] = tg.btype;
      u32[MEM.bxtype + bslot] = tg.bxtype;
      u32[MEM.bz + bslot] = 1;
      wroteTriggers++;
    }

    // C. 玩家出生点（ma=5600/mb=32000 在进关同一帧定位，此刻改写）
    // 注入帧玩家已开始下坠（mb 递增），mb 用下坠容差区间
    var spawnOk = false;
    if (conv.spawn && MEM.ma >= 0 && u32[MEM.ma] === 5600 &&
        u32[MEM.mb] >= 32000 && u32[MEM.mb] <= 33400) {
      u32[MEM.ma] = conv.spawn.x * 100 + 200;
      u32[MEM.mb] = (conv.spawn.y - 30) * 100;   // 略高几格，自然落地
      spawnOk = true;
    }

    // D. 非字节表实体（陷阱管道等）：全部动态分配空槽（跳过 28）
    // 第一个陷阱管道直接放入 slot 28（引擎硬编码动画槽 main.cpp:1885 t=28），
    // 动画在正确坐标上运行。多余管道动态分配空槽（仅声效，无动画）。
    var wroteTraps = 0, overflowTraps = 0;
    if (conv.traps && conv.traps.length && MEM.sa >= 0) {
      for (var ti = 0; ti < conv.traps.length; ti++) {
        var tp = conv.traps[ti];
        var tslot = -1;
        for (n = 0; n < 31; n++) {
          if (n === 28) continue;
          if (u32[MEM.sa + n] === SENTINEL) { tslot = n; break; }
        }
        if (tslot < 0) { overflowTraps++; continue; }
        u32[MEM.sa + tslot] = tp.x;
        u32[MEM.sb + tslot] = tp.y;
        u32[MEM.sc + tslot] = tp.w;
        u32[MEM.sd + tslot] = tp.h;
        u32[MEM.stype + tslot] = tp.stype;
        u32[MEM.sxtype + tslot] = tp.sxtype;
        tp._slot = tslot;
        wroteTraps++;
      }
      // slot 28：屏外隐藏管道，引擎动画硬编码 t=28（main.cpp:1885），
      // 玩家进入任一管道后 JS 在 mb=-80000000（mtm17 传送）瞬间
      // 用世界坐标匹配被进入管道，复制其数据到 slot 28 播放动画
      u32[MEM.sa + 28] = TRAP28_HIDDEN;
      u32[MEM.sb + 28] = TRAP28_HIDDEN;
      u32[MEM.sc + 28] = 6000;
      u32[MEM.sd + 28] = 12000;
      u32[MEM.stype + 28] = 50;
      u32[MEM.sxtype + 28] = 0;
    }

    // 记录各管道原始坐标，供借用时匹配
    var trapBases = [];
    if (conv.traps && conv.traps.length && MEM.sa >= 0) {
      for (var tbi = 0; tbi < conv.traps.length; tbi++) {
        var tp2 = conv.traps[tbi];
        var slot2 = tp2._slot !== undefined ? tp2._slot : -1;
        if (slot2 < 0 || slot2 === 28) continue;
        trapBases.push({ slot: slot2, baseSa: tp2.x, baseSb: tp2.y });
      }
    }
    conv._trapBases = trapBases;
    flyState = null;

    return { wroteBlocks: wroteBlocks, overflowBlocks: overflowBlocks,
             wroteTriggers: wroteTriggers, overflowTriggers: overflowTriggers,
             wroteTraps: wroteTraps, overflowTraps: overflowTraps,
             spawnOk: spawnOk };
  }

  /* ================= BGM（网页侧直接播放，关卡事件不打断它的循环） ================= */
  var bgmAudio = null, bgmWanted = null;
  function ensureBgm(conv) {
    if (!conv.bgms.length) return;
    var want = conv.bgms[0].file;
    if (bgmWanted === want && bgmAudio && !bgmAudio.paused) return;
    if (bgmAudio) { bgmAudio.pause(); bgmAudio = null; }
    bgmWanted = want;
    bgmAudio = new Audio(want);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.45;
    var pr = bgmAudio.play();
    if (pr && pr.catch) pr.catch(function () { /* 自动播放限制时等待开始按钮后重试 */ });
  }
  function pauseBgm() {
    if (bgmAudio) bgmAudio.play(); // 在游戏中持续播放；pause 仅留接口
  }
  function retryBgmAfterGesture() {
    if (bgmAudio && bgmAudio.paused && bgmWanted) {
      var pr = bgmAudio.play();
      if (pr && pr.catch) pr.catch(function () {});
    }
  }

  // 引擎把键盘监听挂在 canvas（捕获阶段）上：当焦点在按钮/其他元素上时按键
  // 到不了 canvas，游戏会卡在“按任意键”过渡。window 捕获阶段统一转发给 canvas。
  (function forwardKeysToCanvas() {
    function fwd(ev) {
      if (!ev || !ev.target || typeof ev.target.nodeType !== 'number') return;
      if (ev.target === canvas || (canvas && canvas.contains(ev.target))) return;
      var ne;
      try {
        ne = new KeyboardEvent(ev.type, { bubbles: true, cancelable: true, key: ev.key, code: ev.code });
        Object.defineProperty(ne, 'keyCode', { get: function () { return ev.keyCode; } });
        Object.defineProperty(ne, 'which', { get: function () { return ev.keyCode; } });
      } catch (e) { return; }
      canvas.dispatchEvent(ne);
    }
    window.addEventListener('keydown', fwd, true);
    window.addEventListener('keyup', fwd, true);
  })();

  /* ================= 界面与流程 ================= */
  var statusEl = document.getElementById('status');
  var infoEl = document.getElementById('levelInfo');
  var startBtn = document.getElementById('startBtn');
  var retryBtn = document.getElementById('retryBtn');
  var canvas = document.getElementById('canvas');
  var level = null;      // {name, bytes, used, skip}

  function setStatus(text, cls) {

    statusEl.className = cls || '';
  }

  function fmtSkip(skip, nameMap) {
    var parts = [];
    Object.keys(skip).forEach(function (id) {
      var cn = (nameMap && nameMap[id]) || id;
      parts.push(cn + '×' + skip[id]);
    });
    return parts.length ? parts.join('、') : '';
  }

  var CN_NAMES = {
    player_start: '玩家起点', item_mushroom_red: '红蘑菇', item_mushroom_dark: '毒蘑菇',
    item_mushroom_purple: '紫蘑菇', item_star: '无敌星', item_green_question: '绿问号球',
    item_flower: '火焰花', item_jumppad: '弹簧跳台', firebar: '火焰棒', fake_pole: '假旗杆',
    enemy_moralar: '小猫咪', enemy_chicken: '肌肉鸡', enemy_cloud_face: '脸云怪',
    enemy_cloud_plain: '普通云怪', enemy_spike_ball: '刺球', enemy_peach_cat: '桃色方块猫',
    enemy_beam: '黄色光束', enemy_flame_h: '横火焰', enemy_fireball: '火球',
    b2_hint: '提示块', b2_pswitch: 'P开关', b2_on: 'ON块', b2_off: 'OFF块',
    b2_note_peach: '音符块', b2_note_white: '白音符块', b2_sword: '剑陷阱',
    b2_blade: '刀刃陷阱', b2_pineapple: '菠萝雷', bgm_field: 'BGM标记', bgm_dungeon: 'BGM标记',
    bgm_star: 'BGM标记', bgm_castle: 'BGM标记', bgm_puyo: 'BGM标记'
  };

  function loadLevelObject(obj, name) {
    try {
      var r = convert(obj);
      level = {
        name: name || '未命名', conv: r,
        blocksN: r.blocks.length, triggersN: r.triggers.length,
        bgmN: r.bgms.length, spawn: !!r.spawn

        (r.traps.length ? ' · 陷阱 ' + r.traps.length : '') +
        (r.bgms.length ? ' · 音乐 ' + r.bgms[0].file.split('/').pop() : '') +

  var patchRetries = 0;

  /* ---------- 每帧：检测进关 → 定位运行时数组 → 注入特殊元素 ---------- */

      injectRetries = 0;

    //   故仅检查 stype 可避免动画被重注入覆盖）
    if (MEM && injectedThisRun && level.conv.traps && level.conv.traps.length &&

      var needReinject = false;
      for (var ti = 0; ti < level.conv.traps.length; ti++) {
        var tp = level.conv.traps[ti];
        var ts = tp._slot !== undefined ? tp._slot : (tp.slot !== undefined ? tp.slot : -1);
        if (flyState && ts === flyState.slot) continue;   // 借用中（stype 被临时清 0）

        injectedThisRun = false;
        injectTimer = 2;
        injectRetries = 0;
      }

    if ((proc === 1 || proc === 10) && injectTimer > 0) {

        if (!MEM) {
          if (injectRetries < 30) { injectRetries++; injectTimer = 3; }
          else { injectState = '运行时数组定位失败（特殊元素未注入）'; setStatus('游戏进行中 · ' + injectState, 'err'); }
        } else if (!injectedThisRun) {

          ensureBgm(level.conv);
          var msgs = [];
          if (res.wroteBlocks) msgs.push('特殊方块 ' + res.wroteBlocks);
          if (res.wroteTriggers) msgs.push('敌人/道具 ' + res.wroteTriggers);
          if (res.wroteTraps) msgs.push('陷阱 ' + res.wroteTraps);
          if (res.overflowBlocks) msgs.push('⚠方块槽已满少' + res.overflowBlocks);
          if (res.overflowTriggers) msgs.push('⚠敌人槽已满少' + res.overflowTriggers);
          if (res.overflowTraps) msgs.push('⚠陷阱槽已满少' + res.overflowTraps);
          if (level.conv.spawn && !res.spawnOk) msgs.push('起点未生效（时机错过）');

    // 并在 mtm=17 把玩家 mb 置 -80000000（传送走）。
    // JS 检测 mb=-80000000 瞬间，此时 ma 仍是进入时的屏幕 x，
    // 用世界坐标 wx=fx+ma 匹配被进入管道，复制其数据到 slot 28。
    // mtm 0-16 期间 ma 不变（mc=0），mtm=17 传送，mtm≥23 sa28 首次变化，
    // mtm≥110 sb28 开始上升。借用在 mtm=17~22 窗口完成（早于 sa28 变化）。
    if (MEM && injectedThisRun && !flyState &&
        level.conv._trapBases && level.conv._trapBases.length &&
        MEM.ma >= 0 && MEM.mb >= 0 && (proc === 1 || proc === 10)) {
      var u32d = new Int32Array(M.HEAPU8.buffer);
      // fx 动态定位：未收敛则每帧用滚动行为筛选候选（滚动中 fx/fzx 递增）
      if (MEM.fx < 0) {

        var fxFound = refineFxWindow(u32d, maNow >= 21000);
        if (fxFound >= 0) MEM.fx = fxFound;
      }
