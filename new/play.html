<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<!-- base 指向新引擎目录：constants.js 中资源路径 ../assets/、../soundEffect/
     均以 new/game/ 为基准解析，引擎文件本身也从该目录加载，不修改引擎目录结构 -->
<base href="game/">
<title>猫里奥 · 自定义关卡试玩（新引擎）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: "Microsoft YaHei", sans-serif;
}
/* 与新引擎页 game/index.html 一致：镜头占满页面宽度 */
#wrap {
  position: relative;
  width: 100vw;
  height: 80vh;
  margin: 40px auto 0;   /* 顶部留出顶栏空间，不重叠 */
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas#canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  outline: none;
  cursor: pointer;
}
#loading {
  position: absolute; inset: 0;
  background: #000; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

/* 悬浮顶栏：半透明覆盖在画面顶部，不占布局空间 */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 6px 10px;
  background: rgba(0, 0, 0, .45);
  pointer-events: none;
}
#topbar b { color: #ffd75e; font-size: 13px; margin-right: 4px; text-shadow: 1px 1px 2px #000; }
#topbar button {
  pointer-events: auto;
  background: rgba(49, 55, 71, .92); color: #e8ecf4;
  border: 1px solid #454d61; border-radius: 5px;
  padding: 4px 9px; font-size: 12px; cursor: pointer;
}
#topbar button:hover { background: #3d4458; }
#startBtn { background: rgba(45, 108, 223, .95) !important; border-color: #4a86f0 !important; color: #fff !important; font-weight: bold; }
#infoBtn { background: rgba(80, 80, 60, .92) !important; }
#status { font-size: 12px; color: #b8c2d6; text-shadow: 1px 1px 2px #000; pointer-events: none; }
#status.ok { color: #7ddc8a; }
#status.err { color: #ff7d7d; }

/* 详情弹窗 */
#modalMask {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(0, 0, 0, .7);
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
#modalMask.show { display: flex; }
#modal {
  position: relative;
  width: 680px; max-width: 96vw; max-height: 86vh; overflow: auto;
  background: #20242e; border: 1px solid #333a48; border-radius: 10px;
  padding: 16px 20px; color: #d8dee9; font-size: 13px; line-height: 1.7;
}
#modal h3 { color: #ffd75e; font-size: 14px; margin: 12px 0 6px; }
#modal h3:first-child { margin-top: 0; }
#modalClose {
  position: absolute; top: 6px; right: 10px;
  background: transparent; border: none; color: #9aa4b8;
  font-size: 22px; line-height: 1; cursor: pointer;
}
#modalClose:hover { color: #fff; }
#skiplist { color: #ffb46b; }
#help kbd {
  background: #313747; border: 1px solid #454d61; border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 6px; font-family: monospace; font-size: 12px; color: #e8ecf4;
}
#dropTip { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(20,40,90,.55); color: #fff; font-size: 22px; pointer-events: none; z-index: 30; }
body.dragging #dropTip { display: flex; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" width="480" height="420" tabindex="0"></canvas>
  <div id="loading">加载中...</div>
</div>

<!-- 悬浮顶栏 -->
<div id="topbar">
  <b>🐱 猫里奥 · 自定义关卡试玩</b>
  <button id="pickBtn">📂 选择JSON</button>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
  <button id="demoBtn">✨ 内置示例</button>
  <button id="startBtn">▶ 开始游戏</button>
  <button id="retryBtn">↺ 回到标题</button>
  <button id="infoBtn">ℹ️ 详情</button>
  <span id="status">正在加载游戏引擎…</span>
</div>

<!-- 详情弹窗（原底部文字） -->
<div id="modalMask">
  <div id="modal">
    <button id="modalClose" title="关闭">×</button>
    <h3>当前关卡</h3>
    <div id="levelInfo">尚未加载关卡（打开本页时若编辑器刚点过"▶ 试玩"，会自动载入那个关卡）</div>
    <h3>操作</h3>
    <div id="help">
      <kbd>←</kbd><kbd>→</kbd> 移动　<kbd>↑</kbd>/<kbd>空格</kbd> 跳　<kbd>↓</kbd> 下蹲/进管道　<kbd>C</kbd> 穿墙作弊　<kbd>M</kbd> 静音<br>
      原理：把编辑器 JSON 直接转换成新引擎关卡定义（字节网格 + 特殊方块 +
      敌人触发器 + 管道/升降台 + 出生点/BGM），覆盖 <code>Levels.get()</code> 后启动。
      陷阱管道动画、左右滚动、敌人回溯重生均为引擎原生支持；死亡自动重开本关，
      通关后也会重开本关方便反复测试。
    </div>
  </div>
</div>
<div id="dropTip">松开以加载关卡 JSON</div>

<!-- 关卡数据（原版 1-1 字节图，自定义关卡不使用，仅保持引擎加载顺序一致） -->
<script src="../stage11_data.js"></script>
<!-- 精灵清单 -->
<script src="../assets/sprites/manifest.js"></script>
<!-- 新引擎模块（base 指向 game/） -->
<script src="constants.js?v=custom2"></script>
<script src="sprites.js?v=custom2"></script>
<script src="audio.js?v=custom2"></script>
<script src="input.js?v=custom2"></script>
<script src="elements.js?v=uid1"></script>
<script src="levels.js?v=custom2"></script>
<script src="engine.js?v=uid1"></script>
<!-- 原版全部关卡数据（传送管道口选择目标世界时用） -->
<script src="../stages_data.js"></script>
<script>
(function () {
  'use strict';

  /* ================= 关卡转换：编辑器 JSON → 新引擎关卡定义 =================
   * 引擎关卡定义（levels.js Levels.get 返回值）：
   *   grid       : 17×1001 字节网格（编码见 constants.js TILE_BYTE）
   *   blocks     : 特殊方块 {x,y,type,xt}（像素单位，loadStage 内部 ×100）
   *   pipes      : 管道/墙体 {sa,sb,sc,sd,stype,sxtype}（世界单位 = 像素×100）
   *   enemies    : 敌人/道具触发器 {ba,bb,btype,bxtype}（世界单位）
   *   lifts      : 升降台 {sra,srb,src,srsp,...}（世界单位）
   *   spawn      : 出生点 {x,y}（像素单位）/ bgm : BGM ID / stagecolor / scrollx
   */
  var ROWS = 17, COLS = 1001;

  // 字节网格元素（值与 constants.js TILE_BYTE / 原版 stage() 解析一致）
  var TILE_VAL = {
    block_brick: 1, block_question: 2, block_hard: 3, block_stair: 4,
    block_ground_top: 5, block_ground_fill: 6, block_hidden: 7, block_cat_shut: 8,
    item_coin: 9, block_spike: 10,
    // 地下/城堡主题变体：机制与基础方块相同，引擎按 stagecolor 自动换贴图（id+30/+60）
    block_d_brick: 1, block_d_question: 2, block_d_hard: 3, block_d_stair: 4,
    block_d_ground_top: 5, block_d_ground_fill: 6, block_d_spike: 10,
    block_c_brick: 1, block_c_question: 2, block_c_hard: 3, block_c_stair: 4,
    block_c_ground_top: 5, block_c_ground_fill: 6, block_c_spike: 10,
    bg_midflag: 30, pipe_top: 40, pipe_body: 41, pipe_v2: 43, pipe_h: 44,
    enemy_syobon: 50, enemy_turtle: 51, enemy_shell: 52, enemy_ghost: 53, enemy_king: 54,
    enemy_tongue_cat: 55, enemy_robot: 56, enemy_syobon_pad: 57, enemy_runner: 58, enemy_flame: 59,
    bg_hill_house: 80, bg_grass: 81, bg_cloud_face: 82, bg_tree: 83,
    bg_cloud_angry: 84, bg_tree_round: 85, bg_lava: 86
  };
  // 注：goal_pole(99) 单独处理（行号需钳制）；lift_* 走 lifts 数组（保留颜色/长度）

  // 特殊方块 → tyobi ttype（语义按新引擎/原版 main.cpp 实际行为）
  var EX_BLOCK = {
    b2_hint:        { type: 300 },          // 提示块
    b2_pswitch:     { type: 400 },          // P 开关
    b2_on:          { type: 130 },
    b2_off:         { type: 131 },
    b2_note_peach:  { type: 117, xt: 1 },   // 桃色音符块
    b2_note_white:  { type: 117, xt: 0 },   // 白色音符块
    b2_sword:       { type: 140 },
    b2_blade:       { type: 141 },
    b2_pineapple:   { type: 142 },
    item_jumppad:   { type: 120 },          // 弹簧跳台
    block_q_mushroom:    { type: 102, xt: 0 },  // 顶出红蘑菇（おいしいきのこ）
    block_q_enemy:       { type: 101, xt: 0 },  // 顶出白猫怪
    block_q_poison:      { type: 103, xt: 0 },  // 顶出棕毒蘑菇（まずいきのこ）
    block_q_poison_mass: { type: 110, xt: 0 },  // 毒蘑菇量产（110→111 周期生成）
    block_q_coin_mass:   { type: 112, xt: 0 },  // 金币量产（112→113）
    block_q_badstar:     { type: 104, xt: 0 },  // 顶出坏星（悪スター）
    block_hidden_poison: { type: 114, xt: 0 }   // 隠し毒きのこ：游戏中隐形，顶到才现形（xt 由 hv 覆盖）
  };

  // 敌人/道具 → 触发器 btype（= 生成的 atype）/ bxtype
  var EX_TRIGGER = {
    item_mushroom_red:    { t: 100, xt: 0 },
    item_mushroom_dark:   { t: 100, xt: 1 },
    item_flower:          { t: 101, xt: 0 },
    item_mushroom_purple: { t: 102, xt: 1 },
    item_green_question:  { t: 105, xt: 0 },
    item_star:            { t: 110, xt: 0 },
    enemy_flame_h:        { t: 10,  xt: 0 },
    enemy_moralar:        { t: 30,  xt: 0 },
    enemy_chicken:        { t: 31,  xt: 0 },
    enemy_cloud_face:     { t: 80,  xt: 0 },
    enemy_cloud_plain:    { t: 81,  xt: 0 },
    enemy_spike_ball:     { t: 83,  xt: 0 },
    enemy_fireball:       { t: 84,  xt: 0 },
    fake_pole:            { t: 85,  xt: 0 },
    enemy_peach_cat:      { t: 86,  xt: 0 },
    enemy_beam:           { t: 90,  xt: 0 },
    firebar:              { t: 87,  xt: 5 }   // xt = 火球个数
  };

  // 升降台 → srsp（渲染颜色）
  var LIFT_SRSP = { lift_yellow: 0, lift_green: 2, lift_gray: 21 };

  var BGM_ID = { bgm_field: 100, bgm_dungeon: 103, bgm_star: 104, bgm_castle: 105, bgm_puyo: 106 };
  var THEME_COLOR = { overworld: 1, dungeon: 2, castle: 4, sky: 3 };

  function convert(level) {
    if (!level || !Array.isArray(level.elements))
      throw new Error('JSON 格式不正确：缺少 elements 数组');
    var grid = [];
    // gridUid：与字节网格平行的 uid 网格（引擎 loadStage 从字节生成运行时对象时带上实例 uid）
    var gridUid = [];
    for (var i = 0; i < ROWS; i++) { grid.push(new Uint8Array(COLS)); gridUid.push(new Array(COLS).fill(null)); }
    var blocks = [], enemies = [], pipes = [], lifts = [], bgms = [], bg = [];
    var spawn = null, skip = {}, used = 0, maxCol = 0;
    var hintTexts = {};

    function put(r, c, v, uid) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      grid[r][c] = v;
      gridUid[r][c] = uid || null;
      return true;
    }

    level.elements.forEach(function (e) {
      if (!e || typeof e.id !== 'string') return;
      var id = e.id;
      var c = e.col | 0, r = e.row | 0;
      if (c > maxCol) maxCol = c;
      var x = c * 29, y = r * 29 - 12;   // 与引擎 loadStage 的世界坐标一致
      if (id === 'goal_pole') {
        if (r > 11) r = 11;               // 杆高 = (12-行) 格
        if (put(r, c, 99, e.uid)) used++;
      } else if (TILE_VAL[id] !== undefined) {
        if (put(r, c, TILE_VAL[id], e.uid)) used++;
      } else if (LIFT_SRSP[id] !== undefined) {
        var len = Math.max(1, Math.min(e.len | 0 || 3, 50));
        lifts.push({
          sra: x * 100, srb: y * 100, src: len * 3000,
          srtype: 0, sracttype: 0, sre: 0, srf: 0,
          srsp: LIFT_SRSP[id], sron: 0, srmuki: 0, srsok: 0, srmove: 0, srmovep: 0,
          uid: e.uid || null
        });
        used++;
      } else if (id === 'platform_hang') {
        // 悬挂站台 srsp=10：绿色台面(30px)+棕色吊柱；srh=自定义柱高(世界单位，原版写死48000)；
        // drop=true → sracttype=1，玩家站上瞬间 sron=1，之后每帧 srf=60 加速下坠并带着玩家掉落
        var pw = Math.max(1, Math.min(e.w | 0 || 5, 50));
        var ph = Math.max(1, Math.min(e.h | 0 || 16, 30));
        lifts.push({
          sra: x * 100, srb: y * 100, src: pw * 3000,
          srtype: 0, sracttype: e.drop ? 1 : 0, sre: 0, srf: 0,
          srsp: 10, sron: 0, srmuki: 0, srsok: 0, srmove: 0, srmovep: 0,
          srh: ph * 2900, uid: e.uid || null
        });
        used++;
      } else if (EX_BLOCK[id] !== undefined) {
        var sp = EX_BLOCK[id];
        var xt = sp.xt || 0;
        // 提示块：从编辑器元素属性读取消息类型和自定义文本
        if (id === 'b2_hint') {
          if (e.hintType === '__custom__' && e.hintCustom) {
            xt = 9000 + blocks.length;  // 唯一 key，避免与预设冲突
            hintTexts[xt] = e.hintCustom.split('\n').slice(0, 7);
          } else if (e.hintType) {
          xt = parseInt(e.hintType, 10) || 1;
        }
        }
        // 隐藏块(114)：hv=0 紫毒蘑菇(默认) / 2 金币 / 10 P开关联动
        if (id === 'block_hidden_poison') xt = (e.hv === 2 || e.hv === 10) ? e.hv : 0;
        blocks.push({ x: x, y: y, type: sp.type, xt: xt, uid: e.uid || null });
      } else if (EX_TRIGGER[id] !== undefined) {
        var tg = EX_TRIGGER[id];
        if (id === 'firebar') {
          // 火焰棒：第0颗火球（圆心）位于格子中心，与引擎绘制/碰撞原点一致；
          // bxtype = 火球数 + (角度+100)*100（>=10000 表示带角度；遗留值 101~120
          // 是原版 P 开关联动值，引擎按随机初相处理）
          var cnt = e.xt || tg.xt;
          var rot = (((e.rot | 0) % 360) + 360) % 360;
          enemies.push({ ba: x * 100 + 1450, bb: y * 100 + 1450, btype: tg.t, bxtype: cnt + (rot + 100) * 100, uid: e.uid || null });
        } else {
          enemies.push({ ba: x * 100, bb: y * 100, btype: tg.t, bxtype: tg.xt, uid: e.uid || null });
        }
      } else if (id === 'pipe_h_mouth_l' || id === 'pipe_h_mouth_r') {
        // 横向管道口：stype=5 横管 + 端口管口沿（sxtype 10=左口、11=右口），
        // 与“管道身(横)”(grid 字节44, stype=5/sxtype=0) 水平拼接
        pipes.push({
          sa: x * 100, sb: y * 100 + 700,
          sc: 3900, sd: 5000,
          stype: 5, sxtype: id === 'pipe_h_mouth_l' ? 10 : 11,
          uid: e.uid || null
        });
      } else if (id === 'pipe_trap') {
        // 陷阱管道 stype=50：引擎原生支持进入动画（抖动→上升→阵亡），
        // 多根管道各自独立，无需 slot 借用
        pipes.push({
          sa: x * 100 + 500, sb: y * 100,
          sc: 6000, sd: 4 * 3000 - 200,
          stype: 50, sxtype: e.sxtype || 0,
          uid: e.uid || null
        });
      } else if (id === 'pipe_warp') {
        // 传送管道口 stype=60：进入后按 warp 目标切关/通关（见 GameEngine.setWarpHandler）
        pipes.push({
          sa: x * 100 + 500, sb: y * 100,
          sc: 6000, sd: 4 * 3000 - 200,
          stype: 60, sxtype: 1,
          uid: e.uid || null,
          warp: e.warp && (e.warp.end || e.warp.id)
            ? { end: !!e.warp.end, id: e.warp.id || null }
            : { end: true, id: null }
        });
      } else if (id === 'block_fall') {
        // 坠落砖组 stype=51：横排沿 y / 竖排沿 x，玩家完全进入长轴区域并处于运动方向一侧时触发
        var fOri = e.ori === 'v' ? 'v' : 'h';
        var fCnt = Math.max(2, Math.min(12, e.count | 0 || 3));
        var fDir = e.dir || 'down';
        if (fOri === 'h' && fDir !== 'up' && fDir !== 'down') fDir = 'down';
        if (fOri === 'v' && fDir !== 'left' && fDir !== 'right') fDir = 'left';
        var fAxis = fOri === 'h' ? 'y' : 'x';
        var fSign = (fDir === 'up' || fDir === 'left') ? -1 : 1;
        pipes.push({
          sa: x * 100, sb: y * 100,
          sc: fOri === 'h' ? fCnt * 3000 - 1 : 3000,
          sd: fOri === 'h' ? 3000 : fCnt * 3000 - 1,
          stype: 51, sxtype: 0,
          mov: { axis: fAxis, dir: fSign },
          uid: e.uid || null
        });
      } else if (id === 'player_start') {
        spawn = { x: x, y: y };
      } else if (BGM_ID[id] !== undefined) {
        bgms.push({ col: c, id: BGM_ID[id] });
      } else if (level.customDefs && level.customDefs[id]) {
        // 自定义元素：按碰撞类型分发
        var cd = level.customDefs[id];
        var ctw = cd.tw || 1, cth = cd.th || 1;
        if (cd.collide === 'block') {
          blocks.push({ x: x, y: y, type: cd.ttype || 3, xt: 0, uid: e.uid || null });
          used++;
        } else if (cd.collide === 'pipe') {
          pipes.push({
            sa: x * 100, sb: y * 100,
            sc: ctw * 3000, sd: cth * 3000,
            stype: cd.stype, sxtype: 0,
            uid: e.uid || null,
            _custom: { dataUrl: cd.dataUrl, tw: ctw, th: cth }
          });
          used++;
        } else if (cd.collide === 'trigger') {
          enemies.push({
            ba: x * 100, bb: y * 100,
            btype: cd.btype, bxtype: 0,
            uid: e.uid || null,
            _custom: { dataUrl: cd.dataUrl, tw: ctw, th: cth }
          });
          used++;
        } else {
          // collide=none → 背景装饰
          bg.push({
            na: x * 100, nb: y * 100, ntype: -1,
            uid: e.uid || null,
            _custom: { dataUrl: cd.dataUrl, tw: ctw, th: cth }
          });
          used++;
        }
      } else {
        skip[id] = (skip[id] || 0) + 1;
      }
    });
    bgms.sort(function (a, b) { return a.col - b.col; });

    var cols = level.cols || (maxCol + 2);
    // BGM：优先取关卡级设置 level.bgm（编辑器音乐 TAB 单选）；
    // 兼容旧数据：画布上的 BGM 标记元素
    var bgmId = ([100, 103, 104, 105, 106].indexOf(level.bgm | 0) >= 0)
      ? (level.bgm | 0)
      : (bgms.length ? bgms[0].id : 100);
    // 合并关卡级 hintTexts 与元素级自定义文本
    var mergedHints = {};
    if (level.hintTexts) for (var hk in level.hintTexts) mergedHints[hk] = level.hintTexts[hk];
    for (var hk2 in hintTexts) mergedHints[hk2] = hintTexts[hk2];

    return {
      grid: grid,
      gridUid: gridUid,
      stagecolor: THEME_COLOR[level.theme] || 1,
      scrollx: Math.max(cols, 120) * 29 * 100,
      bgm: bgmId,
      nextLevel: level.nextLevel || null,
      hintTexts: Object.keys(mergedHints).length ? mergedHints : null,
      blocks: blocks,
      pipes: pipes,
      enemies: enemies,
      lifts: lifts,
      bg: bg,
      spawn: spawn,
      // 统计信息（引擎不读，仅弹窗展示用）
      _skip: skip, _used: used, _cols: cols,
      _bgmName: bgmId
    };
  }

  /* ================= 界面与流程 ================= */
  var statusEl = document.getElementById('status');
  var infoEl = document.getElementById('levelInfo');
  var startBtn = document.getElementById('startBtn');

  var levelConv = null;
  // 原版世界链：isWorldChain=true 时，引擎按 (sta,stb,stc) 坐标取关，
  // 通关(stb++ → 下一大关)、进普通管道(stc++ → 子关)都能解析到正确关卡
  var isWorldChain = false;
  function findStageByCoord(sta, stb, stc) {
    var stages = window.STAGES || [];
    for (var i = 0; i < stages.length; i++) {
      var s = stages[i];
      if (s.sta === sta && s.stb === stb && (s.stc || 0) === stc) return s;
    }
    return null;
  }
  function setCurrentStage(def, worldChain) {
    levelConv = def;
    isWorldChain = !!worldChain;
    // 原版世界：立即同步引擎内部坐标。否则直接载入非 1-1 关卡时，
    // 引擎仍是默认坐标 (1,1,0)，Levels.get 会错误解析成第 1-1 关
    if (isWorldChain && def && def.sta && window.GameEngine && GameEngine._state) {
      GameEngine._state.sta = def.sta;
      GameEngine._state.stb = def.stb;
      GameEngine._state.stc = def.stc || 0;
    }
  }
  function findStageById(id) {
    var stages = window.STAGES || [];
    for (var i = 0; i < stages.length; i++) {
      if (stages[i].id === id) return stages[i];
    }
    return null;
  }
  // 切换到指定世界（传送管道/显式下一关）
  function enterStage(target) {
    setCurrentStage(target, !!(target && target.sta));
  }
  // 覆盖引擎关卡提供器（engine.js 持有同一 Levels 对象引用）：
  // 坐标能在原版 STAGES 命中时返回对应关；自定义关或数据缺失时回退当前关
  window.Levels = window.Levels || {};
  window.Levels.get = function (sta, stb, stc) {
    if (isWorldChain) {
      var t = findStageByCoord(sta, stb, stc || 0);
      if (t) { levelConv = t; return t; }
    }
    return levelConv;
  };

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function openModal() { modalMask.classList.add('show'); }
  function closeModal() { modalMask.classList.remove('show'); }
  infoBtn.addEventListener('click', openModal);
  modalClose.addEventListener('click', closeModal);
  modalMask.addEventListener('click', function (ev) {
    if (ev.target === modalMask) closeModal();
  });
  window.addEventListener('keydown', function (ev) {
    if (ev.keyCode === 27) closeModal();   // Esc 关闭弹窗
  });

    player_start: '玩家起点', item_mushroom_red: '红蘑菇', item_mushroom_dark: '毒蘑菇',
    item_mushroom_purple: '紫蘑菇', item_star: '无敌星', item_green_question: '绿问号球',

  function fmtSkip(skip) {
    var parts = [];
    Object.keys(skip).forEach(function (id) {
      parts.push((CN_NAMES[id] || id) + '×' + skip[id]);
    });
    return parts.join('、');
  }

  function loadLevelObject(obj, name) {
    try {
      var conv, isWorld = false;
      if (obj && obj._worldDef && obj._worldDef.grid) {
        // 编辑器载入“示例世界”且未编辑：直接用原版关卡 def，1:1 还原
        // （含编辑器未暴露的陷阱区/火焰管/消息块/特殊平台等机关）
        conv = obj._worldDef;
        isWorld = true;
        name = name + ' · 原版世界 ' + (conv.id || '');
      } else {
        conv = convert(obj);
      }
      // 原版世界启用坐标链解析（通关/进管自动找下一关）；自定义关始终返回自身
      setCurrentStage(conv, isWorld);
      // 注入自定义 BGM/音效（id→dataUrl）到音频系统
      if (window.AudioSys) {
        var bgmMap = {}, sfxMap = {};
        (obj.customBgm || []).forEach(function (b) { bgmMap[b.id] = b.dataUrl; });
        (obj.customSfx || []).forEach(function (s) { sfxMap[s.id] = s.dataUrl; });
        AudioSys.setCustomBgm(bgmMap);
        AudioSys.setCustomSfx(sfxMap);
      }
      // 已在游戏中则回到标题，避免热切换造成状态不一致
      if (window.GameEngine) GameEngine.backToTitle();

      var bgmTxt = { 100: 'field', 103: 'dungeon', 104: 'star4', 105: 'castle', 106: 'puyo' }[conv.bgm] || '';
      var theme = { 1: '地上', 2: '地下', 3: '空中', 4: '城堡' }[conv.stagecolor] ||
        { overworld: '地上', dungeon: '地下', castle: '城堡', sky: '空中' }[obj.theme] || '';
      var body;
      if (isWorld) {
        var gc = 0;
        for (var r = 0; r < conv.grid.length; r++)
          for (var c = 0; c < 1001; c++) if (conv.grid[r][c]) gc = Math.max(gc, c);
        body = '原版 1:1 还原 · ' + (gc + 2) + ' 列 · ' + theme +
          ' · 特殊方块 ' + conv.blocks.length + ' · 敌人/道具 ' + conv.enemies.length +
          (conv.pipes.length ? ' · 管道/机关 ' + conv.pipes.length : '') +
          (conv.lifts.length ? ' · 升降台 ' + conv.lifts.length : '') +
          ' · 音乐 ' + bgmTxt + (conv.spawn ? ' · 自定义起点' : '');
      } else {
        var skipTxt = fmtSkip(conv._skip);
        body = conv._cols + ' 列 · ' + theme +
          ' · 地图元素 ' + conv._used + ' 格' +
          ' · 特殊方块 ' + conv.blocks.length + ' · 敌人/道具 ' + conv.enemies.length +
          (conv.pipes.length ? ' · 陷阱管道 ' + conv.pipes.length : '') +
          (conv.lifts.length ? ' · 升降台 ' + conv.lifts.length : '') +
          ' · 音乐 ' + bgmTxt +
          (conv.spawn ? ' · 自定义起点' : '') +
          (skipTxt ? '<br><span id="skiplist">⚠ 未知元素、已跳过：' + skipTxt + '</span>' : '');
      }
      infoEl.innerHTML = '「' + name + '」— ' + body +
        '<br>点"▶ 开始游戏"或直接点击画面开始；点顶栏"ℹ️ 详情"可随时查看本信息';
      setStatus('✓ 关卡已载入新引擎', 'ok');
    } catch (err) {
      setStatus('关卡加载失败：' + err.message, 'err');
    }
  }

  /* ---------- 引擎初始化 ---------- */
  GameEngine.init(canvas);
  setStatus('引擎已就绪', 'ok');
  setTimeout(function () { loadingEl.style.display = 'none'; }, 500);

  // 传送管道口（stype=60）：进入后按目标切换世界或游戏结束
  GameEngine.setWarpHandler(function (warp) {
    if (!warp || warp.end) {
      setStatus('🏁 通关！游戏结束（由传送管道触发）', 'ok');
      GameEngine.backToTitle();
      return false;   // 宿主自行处理结局，引擎不重载
    }
    var stages = window.STAGES || [];
    var target = null;
    for (var i = 0; i < stages.length; i++) {
      if (stages[i].id === warp.id) { target = stages[i]; break; }
    }
    if (!target) {
      setStatus('传送失败：找不到目标世界「' + warp.id + '」', 'err');
      GameEngine.backToTitle();
      return false;
    }
    enterStage(target);
    setStatus('✈ 已传送到世界 ' + target.id + '（' + target.name + '）', 'ok');
    return true;    // 让引擎重载到目标关卡
  });

  // 通关后去向（goal_pole 触发）：按编辑器配置切换世界或游戏结束
  GameEngine.setGoalNextHandler(function (nextLevel) {
    if (!nextLevel || nextLevel.end) {
      setStatus('🏁 通关！游戏结束', 'ok');
      GameEngine.backToTitle();
      return false;
    }
    if (!nextLevel.id) {
      // {end:false, id:null} = 默认进入下一关：引擎 stb++ 后由 Levels.get 按坐标解析
      // （原版世界链命中下一大关；自定义关坐标不命中，回退重载自身）
      return true;
    }
    var target = findStageById(nextLevel.id);
    if (!target) {
      setStatus('找不到下一关世界「' + nextLevel.id + '」', 'err');
      GameEngine.backToTitle();
      return false;
    }
    enterStage(target);
    setStatus('✈ 进入世界 ' + target.id + '（' + target.name + '）', 'ok');
    return true;
  });

  // 首次用户交互解锁音频（与 game/index.html 一致）
  var audioUnlocked = false;
  function unlockAudio() {
    if (!audioUnlocked) {
      audioUnlocked = true;
      if (window.AudioSys) AudioSys.unlock();
    }
  }
  canvas.addEventListener('click', unlockAudio);
  window.addEventListener('keydown', unlockAudio);

  // 点击画面开始（标题画面时）
  canvas.addEventListener('click', function () {
    if (GameEngine.getState().proc === 100 && levelConv) GameEngine.startGame();
  });

  startBtn.addEventListener('click', function () {
    if (!levelConv) { setStatus('请先载入关卡', 'err'); return; }
    GameEngine.startGame();
    canvas.focus();
  });
  retryBtn.addEventListener('click', function () {
    GameEngine.backToTitle();
  });

  /* ---------- JSON 载入途径 ---------- */
  document.getElementById('pickBtn').addEventListener('click', function () {
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function (ev) {
    var f = ev.target.files[0];
    if (f) readFile(f);
    ev.target.value = '';
  });
  function readFile(f) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        loadLevelObject(JSON.parse(rd.result), f.name.replace(/\.json$/i, ''));
      } catch (err) {
        setStatus('JSON 解析失败：' + err.message, 'err');
      }
    };
    rd.readAsText(f);
  }
  window.addEventListener('dragover', function (ev) {
    ev.preventDefault();
    document.body.classList.add('dragging');
  });
  window.addEventListener('dragleave', function () { document.body.classList.remove('dragging'); });
  window.addEventListener('drop', function (ev) {
    ev.preventDefault();
    document.body.classList.remove('dragging');
    var f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (f) readFile(f);
  });
